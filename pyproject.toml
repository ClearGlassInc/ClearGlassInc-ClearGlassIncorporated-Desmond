[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artemis-intelligence"
version = "5.0.0"
description = "ARTEMIS ClearGlass Intelligence Platform Agent Layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
environmental = [
    "streamlit>=1.41",
    "pandas>=2.2",
    "plotly>=5.24",
]
openai = [
    "openai>=2.36.0,<3",
]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.9",
    "mypy>=1.10",
]

[project.scripts]
artemis-api = "artemis.api.app:main"
artemis-function-agent = "artemis.function_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = [".", "sentinel", "clearglass-commerce/control-plane"]
testpaths = ["artemis/tests", "tests", "sentinel/tests", "clearglass-commerce/control-plane/tests"]
addopts = "-v --tb=short --import-mode=importlib"

[tool.coverage.run]
source = ["artemis"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vendor"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["artemis*"]
