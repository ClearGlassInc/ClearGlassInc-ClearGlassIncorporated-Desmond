<script>
/* cg-boot-loader: first-visit boot routing — plays /loader.html once per browser
   session on every page except the homepage. Bypass with ?skipboot=1, or visit
   /loader.html directly to replay. */
(function(){
  try {
    var ua = navigator.userAgent || '';
    if (/bot|crawl|spider|slurp|bingpreview|google|bing|duckduck|baidu|yandex|sogou|exabot|facebot|ia_archiver|lighthouse|gptbot|oai-searchbot|chatgpt|claudebot|claude-web|anthropic|perplexity|amazonbot|applebot|ccbot|cohere|google-extended/i.test(ua)) return;
    if (/[?&]skipboot=1\b/.test(location.search)) return;
    var path = location.pathname;
    /* homepage renders with no loader */
    if (path === '/' || path === '/index.html') return;
    if (sessionStorage.getItem('cg.booted')) return;
    sessionStorage.setItem('cg.booted', '1');
    var here = path + location.search + location.hash;
    location.replace('/loader.html?next=' + encodeURIComponent(here));
  } catch (e) { /* storage unavailable — render normally */ }
})();
</script>
