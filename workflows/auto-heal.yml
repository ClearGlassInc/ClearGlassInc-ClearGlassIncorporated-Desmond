name: Auto Heal

on:
  workflow_run:
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: auto-heal-${{ github.repository }}
  cancel-in-progress: false

jobs:
  heal:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.name != 'Auto Heal')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout default branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${DEFAULT_BRANCH}"
          git checkout -B "${DEFAULT_BRANCH}" FETCH_HEAD

      - name: Analyze and heal recent failures
        id: heal
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTO_HEAL_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          AUTO_HEAL_WORKFLOW_NAME: Auto Heal
        run: python .github/auto-heal/auto_heal.py

      - name: Apply deterministic workflow doctor repairs
        if: steps.heal.outputs.needs_workflow_doctor == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/workflow_doctor.py ]]; then
            python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
            python scripts/workflow_doctor.py --fix
          else
            echo "No scripts/workflow_doctor.py present; diagnostics will remain review-only."
          fi

      - name: Create review branch for generated changes
        id: changes
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_RUN: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain .github/auto-heal .github/workflows)" ]]; then
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="auto-heal/${SOURCE_RUN}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "ClearGlass Auto Heal"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add .github/auto-heal .github/workflows
          git commit -m "Auto-heal: record diagnostics and deterministic repairs"
          git push --set-upstream origin "${BRANCH}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Open auto-heal pull request
        if: steps.changes.outputs.branch != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ steps.changes.outputs.branch }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url || '' }}
        run: |
          set -euo pipefail
          gh pr create \
            --base "${DEFAULT_BRANCH}" \
            --head "${BRANCH}" \
            --title "Auto-heal: repair GitHub Actions failure" \
            --body "Automated, review-gated self-healing update.

          Source run: ${SOURCE_RUN_URL:-scheduled scan}

          This PR contains only generated diagnostics/history and deterministic workflow repairs permitted by .github/auto-heal/healing-strategies.json. No secrets are changed, no protected branch is force-pushed, and auto-merge is disabled."
