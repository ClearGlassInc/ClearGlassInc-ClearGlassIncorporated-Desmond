name: IndexNow Submission

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated canonical ClearGlass URLs"
        required: true
        default: "https://www.clearglassinc.com/"

permissions:
  contents: read

concurrency:
  group: indexnow-submission
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: search-submission
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Validate and submit URLs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SUBMISSION_URLS: ${{ inputs.urls }}
        run: |
          set -euo pipefail
          read -r -a urls <<< "$SUBMISSION_URLS"
          python3 tools/indexnow_submit.py "${urls[@]}"
