offers:
  executive_cyber_ai_risk_checkup:
    name: Executive Cyber and AI Risk Checkup
    target_buyer: Owner, managing partner, executive director, operations leader
    business_problem: Executives need a prioritized view of cyber and AI risk without enterprise-consulting overhead.
    deliverables: [90-minute assessment, prioritized findings, executive briefing, remediation roadmap]
    boundaries: Advisory assessment only; no guarantee of security; implementation is separately scoped.
    pricing_framework: Entry fixed-fee assessment for Burlington SMEs, final price approved by ClearGlass.
    cta: Book a confidential risk review
    qualification_rules: [5-100 employees, sensitive data, Ontario location, executive sponsor]
    upsell_path: Microsoft 365 Security Review or Ransomware Readiness Assessment
    recurring_revenue_path: ClearGlass Guardian or Cybersecurity Retainer
  microsoft_365_security_review:
    name: Microsoft 365 Security Review
    target_buyer: Professional-services owner, IT manager, office manager
    business_problem: Identity, administrator roles, and email controls often determine account-compromise exposure.
    deliverables: [MFA review, administrator-role review, email-security assessment, compromise-readiness checklist]
    boundaries: Configuration review and recommendations unless remediation is approved separately.
    pricing_framework: Fixed review plus optional remediation sprint.
    cta: Request a Microsoft 365 protection review
    qualification_rules: [uses Microsoft 365, handles confidential client data]
    upsell_path: Executive Cyber and AI Risk Checkup
    recurring_revenue_path: ClearGlass Guardian
  ransomware_readiness_assessment:
    name: Ransomware Readiness Assessment
    target_buyer: Operations leader, plant manager, property manager, construction executive
    business_problem: Backup existence is not recovery evidence until restoration has been tested.
    deliverables: [backup verification plan, recovery evidence review, endpoint posture review, incident-response checklist]
    boundaries: No emergency incident response unless separately contracted.
    pricing_framework: Fixed assessment with optional tabletop and retainer.
    cta: Test your recovery readiness
    qualification_rules: [operational downtime risk, critical files, no tested restore evidence]
    upsell_path: Incident-response tabletop
    recurring_revenue_path: Cybersecurity Retainer
  home_small_office_network_audit:
    name: Home and Small-Office Network Security Audit
    target_buyer: Founder, remote professional, small-office operator
    business_problem: Routers, Wi-Fi, endpoints, and updates are often unmanaged.
    deliverables: [router review, Wi-Fi review, endpoint exposure review, secure configuration plan]
    boundaries: Local network audit; ISP or device replacement costs excluded.
    pricing_framework: Entry fixed-fee audit.
    cta: Secure the office network
    qualification_rules: [Ontario small office, owner approval, device inventory available]
    upsell_path: Microsoft 365 Security Review
    recurring_revenue_path: Quarterly security checkup
  clearglass_guardian:
    name: ClearGlass Guardian
    target_buyer: SME executive seeking recurring oversight
    business_problem: Leaders need recurring alerts and executive reporting without a full-time security team.
    deliverables: [continuous monitoring plan, security alerts, monthly executive report]
    boundaries: Monitoring scope must be approved; no autonomous remediation without approval.
    pricing_framework: Monthly subscription by scope and endpoint/account count.
    cta: Build a monitored resilience plan
    qualification_rules: [assessment completed, approved monitoring scope, named owner]
    upsell_path: Cybersecurity Retainer
    recurring_revenue_path: Core subscription
  cybersecurity_retainer:
    name: Cybersecurity Retainer
    target_buyer: Executive, managing partner, board or nonprofit leader
    business_problem: Cyber risk requires recurring guidance, vendor review, and incident preparation.
    deliverables: [monthly advisory, policy support, risk reviews, incident preparation, vendor-security guidance]
    boundaries: Advisory retainer; legal advice and emergency incident response separately scoped.
    pricing_framework: Monthly retainer based on advisory hours and risk surface.
    cta: Add executive cyber-risk oversight
    qualification_rules: [named executive owner, recurring need, approved scope]
    upsell_path: AI Governance Readiness
    recurring_revenue_path: Monthly retainer
  ai_governance_readiness:
    name: AI Governance Readiness
    target_buyer: Executive, compliance lead, operations leader
    business_problem: Employees may use generative AI without approved data-handling controls.
    deliverables: [AI-use policy, data-handling controls, employee guidelines, risk register, governance evidence package]
    boundaries: Governance and policy support; not legal advice.
    pricing_framework: Fixed readiness package plus recurring governance retainer.
    cta: Create an approved AI-use policy
    qualification_rules: [uses generative AI, handles business or client data, executive sponsor]
    upsell_path: Cybersecurity Retainer
    recurring_revenue_path: Governance retainer
