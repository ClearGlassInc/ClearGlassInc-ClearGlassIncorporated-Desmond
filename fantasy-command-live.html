        :root{ --bg:#060A14; --lime:#C7FF4D; --cyan:#51D8FF; --gold:#FFC857; --muted:#9AA3B2; --glass:rgba(255,255,255,0.06); --border:rgba(255,255,255,0.12); }
        *{ box-sizing:border-box }
        html,body{ margin:0; padding:0; background:var(--bg); color:#E9EEF5; font-family: ui-sans-system,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif; }
        ::selection{ background:var(--lime); color:#060A14 }
        .tabular{ font-variant-numeric: tabular-nums; font-feature-settings:"tnum"; }
        .glass{ background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03)); backdrop-filter: blur(16px) saturate(140%); border:1px solid var(--border); }
        .glow-lime{ box-shadow: 0 0 0 1px rgba(199,255,77,0.18), 0 0 32px rgba(199,255,77,0.18); }
        .glow-cyan{ box-shadow: 0 0 0 1px rgba(81,216,255,0.18), 0 0 32px rgba(81,216,255,0.16); }
        .reveal{ opacity:0; transform: translateY(14px); transition: opacity .6s ease, transform .6s ease; }
        .reveal.in-view{ opacity:1; transform:none; }
        a{ color:inherit }
        button{ font:inherit }
        /* nav */
        .nav{ position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding:14px 22px; background: rgba(6,10,20,0.72); backdrop-filter: blur(18px); border-bottom:1px solid rgba(255,255,255,0.08); }
        .brand{ display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:-0.02em; }
        .brand-mark{ width:28px; height:28px; border-radius:8px; background: radial-gradient(120% 120% at 20% 20%, var(--lime), #8AC000); display:grid; place-items:center; color:#060A14; font-weight:900; }
        .nav-links{ display:flex; gap:18px; align-items:center; }
        .nav-links a{ text-decoration:none; font-size:13px; letter-spacing:0.02em; color:var(--muted); }
        .nav-links a:hover{ color:#fff }
        .btn{ border-radius:999px; padding:10px 16px; border:1px solid transparent; cursor:pointer; transition:.2s; display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:13px; letter-spacing:0.01em; }
        .btn-lime{ background:var(--lime); color:#060A14; }
        .btn-lime:hover{ transform: translateY(-1px); box-shadow:0 0 24px rgba(199,255,77,0.4); }
        .btn-ghost{ background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.14); color:#fff; }
        .hamburger{ display:none; width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background: rgba(255,255,255,0.06); }
        /* hero */
        .hero{ display:grid; grid-template-columns: 1.1fr 0.9fr; gap:28px; padding:38px 22px 18px; max-width:1240px; margin:0 auto; }
        .headline{ font-size: clamp(34px, 5.2vw, 64px); line-height:0.92; letter-spacing:-0.04em; font-weight:900; margin:0; }
        .headline span{ background: linear-gradient(90deg, var(--lime), var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent; }
        .sub{ color:var(--muted); font-size:16px; line-height:1.55; margin-top:14px; max-width:46ch; }
        .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
        .chip{ font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; padding:6px 10px; border-radius:999px; border:1px solid var(--border); background: rgba(255,255,255,0.04); }
        .chip.live{ background: rgba(199,255,77,0.12); border-color: rgba(199,255,77,0.35); color:var(--lime); }
        .chip.cyan{ background: rgba(81,216,255,0.1); border-color: rgba(81,216,255,0.3); color:var(--cyan); }
        .chip.gold{ background: rgba(255,200,87,0.1); border-color: rgba(255,200,87,0.3); color:var(--gold); }
        .dashboard{ display:grid; gap:12px; }
        .stat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
        .card{ border-radius:18px; padding:16px; }
        .card h4{ margin:0 0 6px; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); }
        .big-num{ font-size:28px; font-weight:900; letter-spacing:-0.03em; }
        .field-wrap{ border-radius:20px; overflow:hidden; position:relative; }
        .field-wrap canvas{ display:block; width:100%; height: 178px; touch-action:none; cursor:crosshair; }
        .drag-chips{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
        .player-chip{ user-select:none; padding:8px 12px; border-radius:999px; font-size:12px; font-weight:700; border:1px solid var(--border); background: rgba(255,255,255,0.06); cursor:grab; display:inline-flex; gap:8px; align-items:center; }
        .player-chip:active{ cursor:grabbing; }
        .player-chip.dragging{ opacity:0.5; }
        /* tabs */
        .tabs{ max-width:1240px; margin:18px auto; padding:0 22px; }
        .tab-bar{ display:flex; gap:10px; flex-wrap:wrap; border-bottom:1px solid var(--border); padding-bottom:12px; }
        .tab-btn{ padding:10px 16px; border-radius:999px; border:1px solid transparent; background:transparent; color:var(--muted); font-weight:700; font-size:13px; cursor:pointer; min-width:0; }
        .tab-btn.active{ background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.18); color:#fff; box-shadow:0 0 0 1px rgba(255,255,255,0.06) inset; }
        .panel{ margin-top:18px; overflow:hidden; }
        table{ width:100%; border-collapse:collapse; min-width:560px; }
        th{ text-align:left; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); padding:10px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
        td{ padding:12px 8px; border-bottom:1px solid rgba(255,255,255,0.06); font-size:13px; white-space:nowrap; }
        tr:hover td{ background: rgba(255,255,255,0.02); }
        .handle{ cursor:grab; color:var(--muted); user-select:none; padding:0 6px; }
        .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%; border-radius:12px; }
        /* features */
        .features{ max-width:1240px; margin:44px auto; padding:0 22px; display:grid; grid-template-columns: repeat(3,1fr); gap:18px; }
        .feature-card{ border-radius:20px; padding:18px; min-height:148px; }
        .feature-card b{ display:block; margin-top:8px; font-size:14px; }
        .feature-card p{ margin:6px 0 0; color:var(--muted); font-size:13px; line-height:1.5; }
        .steps{ max-width:1240px; margin:14px auto; padding:0 22px; display:grid; grid-template-columns: repeat(3,1fr); gap:18px; }
        .step{ border-radius:20px; padding:18px; border:1px dashed rgba(255,255,255,0.14); background: rgba(255,255,255,0.03); }
        .pricing{ max-width:1240px; margin:44px auto; padding:0 22px; }
        .pricing-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:18px; margin-top:18px; }
        .price-card{ border-radius:22px; padding:20px; position:relative; }
        .price-card.featured{ border-color: rgba(199,255,77,0.5); box-shadow: 0 0 0 1px rgba(199,255,77,0.25), 0 0 40px rgba(199,255,77,0.15); }
        .toggle{ display:inline-flex; background: rgba(255,255,255,0.06); border:1px solid var(--border); border-radius:999px; padding:4px; gap:4px; }
        .toggle button{ padding:6px 12px; border-radius:999px; border:0; background:transparent; color:var(--muted); cursor:pointer; font-weight:700; font-size:12px; }
        .toggle button.active{ background:#fff; color:#060A14; }
        .method{ max-width:1240px; margin:18px auto; padding:0 22px; display:grid; grid-template-columns: 1.1fr 0.9fr; gap:14px; }
        .legal{ max-width:1240px; margin:18px auto; padding:0 22px; display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
        .faq{ max-width:1240px; margin:18px auto; padding:0 22px; }
        .cta{ max-width:860px; margin:28px auto; padding:22px; border-radius:24px; }
        .toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#111A2A; border:1px solid rgba(255,255,255,0.14); color:#fff; padding:12px 16px; border-radius:999px; font-size:13px; z-index:80; box-shadow:0 12px 40px rgba(0,0,0,0.5); display:flex; gap:10px; align-items:center; }
        footer{ border-top:1px solid rgba(255,255,255,0.08); padding:18px 22px; color:var(--muted); font-size:12px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; }
        input, select{ background: rgba(255,255,255,0.06); border:1px solid var(--border); color:#fff; border-radius:12px; padding:10px 12px; font-size:13px; outline:none; }
        input:focus{ border-color: var(--lime); box-shadow:0 0 0 3px rgba(199,255,77,0.18); }
        @media (max-width:1040px){
          .nav-links{ display:none; }
          .nav-links.open{ display:flex; position:absolute; top:64px; left:12px; right:12px; flex-direction:column; align-items:stretch; background: rgba(10,16,30,0.96); backdrop-filter: blur(18px); border:1px solid var(--border); border-radius:16px; padding:12px; }
          .hamburger{ display:grid; place-items:center; }
          .hero{ grid-template-columns: 1fr; }
          .features{ grid-template-columns: 1fr; }
          .steps{ grid-template-columns: 1fr; }
          .pricing-grid{ grid-template-columns: 1fr; }
          .method{ grid-template-columns: 1fr; }
          .legal{ grid-template-columns: 1fr; }
          .stat-grid{ grid-template-columns: 1fr; }
        }
