# ClearGlass Cryptocurrency Configuration File

[blockchain]
# Mining difficulty (number of leading zeros required in block hash)
difficulty = 4

# Mining reward per block (CGLASS tokens)
mining_reward = 50

# Maximum total supply
max_supply = 21000000

# Target time between blocks (seconds)
block_time = 60

[network]
# Network protocol version
protocol_version = 1.0

# Default node port for P2P communication
p2p_port = 8333

# API server port
api_port = 5000

# Maximum peers to connect to
max_peers = 50

# Connection timeout (seconds)
connection_timeout = 10

# Peer discovery interval (seconds)
discovery_interval = 30

# Blockchain sync interval (seconds)
sync_interval = 60

[api]
# Enable CORS (for web applications)
enable_cors = true

# API rate limiting (requests per hour)
rate_limit = 100

# Debug mode
debug = false

# Allowed origins (comma-separated)
allowed_origins = *

[wallet]
# Default wallet directory
wallet_dir = ./wallets

# Wallet file permissions (Unix octal)
file_permissions = 0600

# Enable wallet encryption (requires password)
enable_encryption = false

# Backup on every transaction
auto_backup = false

[mining]
# Enable mining
enable_mining = true

# Number of mining threads
mining_threads = 1

# Auto-mine pending transactions
auto_mine = false

# Minimum transactions before mining
min_transactions = 1

[security]
# Minimum transaction amount (to prevent spam)
min_transaction_amount = 0.00000001

# Maximum transaction amount per block
max_transaction_amount = 1000000

# Transaction fee (percentage)
transaction_fee = 0.0

# Enable transaction verification
verify_transactions = true

[logging]
# Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
log_level = INFO

# Log file location
log_file = ./logs/clearglass.log

# Enable console logging
console_logging = true

# Log format
log_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s

[database]
# Database type (json, sqlite, postgresql)
db_type = json

# Database path (for file-based databases)
db_path = ./data/blockchain.json

# Auto-save interval (seconds, 0 to disable)
autosave_interval = 300

[advanced]
# Enable smart contracts (future feature)
enable_smart_contracts = false

# Enable atomic swaps (future feature)
enable_atomic_swaps = false

# Enable lightning network (future feature)
enable_lightning = false

# Maximum block size (bytes, 0 for unlimited)
max_block_size = 0

# Memory pool size (maximum pending transactions)
mempool_size = 1000

# Enable difficulty adjustment
enable_difficulty_adjustment = false

# Difficulty adjustment interval (blocks)
difficulty_adjustment_interval = 2016
