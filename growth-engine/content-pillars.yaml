pillars:
  - id: technical-clarity
    name: Technical Clarity
    stage: awareness
    description: Teach precise problems, frameworks, and decision criteria that security and ops leaders face daily.
    keywords:
      - cybersecurity hardening
      - AI agent governance
      - audit-ready systems
      - zero-trust evolution
      - supply chain security
    formats:
      - short insight
      - framework post
      - checklist
    platforms: [x, linkedin, threads]

  - id: proof-authority
    name: Proof & Authority
    stage: trust
    description: Demonstrate real systems, design decisions, and measurable outcomes without hype.
    keywords:
      - ClearGlass Artemis
      - governed AI
      - production agent systems
      - Ontario cybersecurity
      - executive operating model
    formats:
      - case pattern
      - architecture walkthrough
      - before-after contrast
    platforms: [linkedin, blog, x]

  - id: contrast-insight
    name: Contrast & Insight
    stage: consideration
    description: Challenge conventional advice and surface non-obvious trade-offs.
    keywords:
      - why most AI pilots fail
      - security theater vs real control
      - agent autonomy boundaries
      - compliance as advantage
    formats:
      - opinion thread
      - contrarian take
      - decision matrix
    platforms: [x, linkedin]

  - id: conversion
    name: Direct Conversion
    stage: conversion
    description: Clear, high-trust calls to action that move attention into owned assets.
    keywords:
      - discovery call
      - security assessment
      - AI agent readiness
      - ClearGlass protocols
    formats:
      - soft CTA post
      - resource offer
      - invitation
    platforms: [linkedin, x, email]

series:
  - name: "Clarity Series"
    pillar: technical-clarity
    cadence: weekly
  - name: "System Design Notes"
    pillar: proof-authority
    cadence: bi-weekly
  - name: "Uncomfortable Truths"
    pillar: contrast-insight
    cadence: weekly
