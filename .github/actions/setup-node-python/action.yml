name: "Setup Node + Python"
description: >
  Install Node.js and Python at the versions this repository's CI pins, plus
  ci.yml's pinned Python gate tools. Defaults match .github/workflows/ci.yml.
  Do not lower Node below 22.6: the admin login guard strips TypeScript types
  natively (tests/test_node_toolchain_guard.py). No global eslint, prettier or
  black is installed - none of them is configured here, and running them would
  reformat the static site wholesale.

inputs:
  node_version:
    description: Node.js version.
    required: false
    default: "22"
  python_version:
    description: Python version.
    required: false
    default: "3.11"
  install_python_tools:
    description: "'true' installs ci.yml's pinned gate tools: pytest, pytest-cov, pyyaml, ruff==0.15.8."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node_version }}

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python_version }}

    # ruff is pinned for the reason ci.yml gives: an unpinned install pulls a
    # newer default rule set and turns `ruff check .` red with no code change.
    - name: Install pinned Python gate tools
      if: inputs.install_python_tools == 'true'
      shell: bash
      run: python -m pip install --quiet pytest pytest-cov pyyaml "ruff==0.15.8"
