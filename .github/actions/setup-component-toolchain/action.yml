# Toolchain setup for one build component (see scripts/ci/components.py).
# Restored from e0301ef as its own action: setup-node-python now holds #187's
# version, whose inputs (node_version, python_version) differ from these.
#
# Either toolchain is skipped when its version input is empty, so a Python-only
# component never pays for a Node install and vice versa. Local composite action:
# the actions it calls are pinned to full commit SHAs like every workflow here.
name: "Setup Component Toolchain"
description: "Install the pinned Python and/or Node toolchain a component needs, with dependency caching."

inputs:
  python-version:
    description: "Python version; empty skips Python."
    required: false
    default: ""
  node-version:
    description: "Node version; empty skips Node."
    required: false
    default: ""
  working-directory:
    description: "Component directory (holds package-lock.json for Node)."
    required: false
    default: "."
  python-requirements:
    description: "Repository-relative requirements file to install; empty installs tooling only."
    required: false
    default: ""
  install-node-dependencies:
    description: "Run npm ci when the component has a package-lock.json."
    required: false
    default: "true"
  ruff-version:
    description: "ruff pin. Bump deliberately: a newer ruff widens the default rule set."
    required: false
    default: "0.15.8"

runs:
  using: "composite"
  steps:
    - name: Resolve cache keys
      id: keys
      shell: bash
      env:
        WD: ${{ inputs.working-directory }}
        REQS: ${{ inputs.python-requirements }}
      run: |
        set -euo pipefail
        # setup-python's pip cache errors when its dependency path matches nothing.
        if [ -n "$REQS" ] && [ -f "$REQS" ]; then
          echo "pip_path=$REQS" >> "$GITHUB_OUTPUT"
        else
          echo "pip_path=requirements.txt" >> "$GITHUB_OUTPUT"
        fi
        if [ -f "$WD/package-lock.json" ]; then
          echo "npm_cache=npm" >> "$GITHUB_OUTPUT"
        else
          echo "npm_cache=" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Python
      if: inputs.python-version != ''
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ steps.keys.outputs.pip_path }}

    - name: Install Python tooling and dependencies
      if: inputs.python-version != ''
      shell: bash
      env:
        RUFF_VERSION: ${{ inputs.ruff-version }}
        REQS: ${{ inputs.python-requirements }}
      run: |
        set -euo pipefail
        pip install "ruff==${RUFF_VERSION}" pytest
        if [ -n "$REQS" ]; then
          if [ ! -f "$REQS" ]; then
            echo "::error title=Missing requirements::$REQS does not exist"
            exit 1
          fi
          pip install -r "$REQS"
        fi

    - name: Set up Node
      if: inputs.node-version != ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ steps.keys.outputs.npm_cache }}
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install Node dependencies (locked)
      if: inputs.node-version != '' && inputs.install-node-dependencies == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if [ -f package-lock.json ]; then
          npm ci --no-audit --no-fund
        else
          echo "::notice::No package-lock.json in $PWD; skipping npm ci (an unlocked install is not reproducible)."
        fi
