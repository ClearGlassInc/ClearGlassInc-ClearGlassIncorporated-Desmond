name: Artemis Browser Assistant

on:
  push:
    branches: [main]
    paths:
      - 'apps/artemis-browser/**'
      - 'artemis/intelligence/browser_assistant.py'
      - 'artemis/tests/test_browser_assistant.py'
      - '.github/workflows/artemis-browser.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/artemis-browser/**'
      - 'artemis/intelligence/browser_assistant.py'
      - 'artemis/tests/test_browser_assistant.py'
      - '.github/workflows/artemis-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install pytest
      - run: python -m pytest artemis/tests/test_browser_assistant.py -q
      - name: Check for the browser app
        id: app
        run: |
          set -euo pipefail
          if [ -d apps/artemis-browser ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Artemis browser app absent::apps/artemis-browser is not in this repository; its build did not run. The Python assistant tests above did."
          fi
      - if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/artemis-browser/package-lock.json
      - if: steps.app.outputs.present == 'true'
        working-directory: apps/artemis-browser
        run: npm ci
      - if: steps.app.outputs.present == 'true'
        working-directory: apps/artemis-browser
        run: npm run typecheck
      - if: steps.app.outputs.present == 'true'
        working-directory: apps/artemis-browser
        run: npm run build
