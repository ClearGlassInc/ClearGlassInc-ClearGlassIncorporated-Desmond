name: ClearGlass GitHub Pages Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least-privilege: this workflow only reads the repo to validate the static
# site and upload it as an artifact. It never writes back, so contents: read
# is sufficient.
permissions:
  contents: read

jobs:
  validate-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify required files
        run: |
          test -f index.html
          echo "✓ index.html found"

      - name: Upload site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clearglass-site
          path: .
