name: Shield G01 Isolated MVP
on:
  pull_request:
    paths:
      - "shield/**"
      - ".github/workflows/shield-g01-mvp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shield-g01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  g01:
    name: G01 isolated disposable validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      G01_BASELINE_SHA: 031cdcda0411b92e433af6faef0fbc8a8a33986a
      SHIELD_ARTIFACT_DIR: artifacts/shield-g01
      SHIELD_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # apt, not pip: the runtime suite runs under sudo and needs pytest there too.
      # wireguard-go is the fallback if the runner kernel has no WireGuard module.
      - name: Install isolated test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wireguard-tools wireguard-go iproute2 iptables python3-pytest

      - name: Static boundary tests
        run: python3 -m pytest -q -p no:cacheprovider shield/tests

      - name: Verify repository boundary
        run: |
          ! grep -RInE 'sk_live_|STRIPE_SECRET|api\.stripe\.com|https?://[^ ]*(production|prod)[^ ]*' shield
          ! find shield -type f \( -name '*.key' -o -name '.env' \) -print

      - name: Execute static checks and two clean G01 cycles
        run: sudo -E bash shield/scripts/run-g01.sh

      - name: Generate non-sensitive runtime evidence and compute the G01 gate
        if: always()
        run: |
          sudo -E python3 shield/scripts/generate-evidence.py
          ! grep -RInE 'sk_live_|-----BEGIN .*PRIVATE KEY-----|STRIPE_SECRET' artifacts/shield-g01

      - name: Verify clean teardown
        if: always()
        run: sudo bash shield/scripts/verify-clean.sh

      - name: Upload non-sensitive evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698f4b7297cfb7b0e5f7f6d
        with:
          name: shield-g01-evidence-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/shield-g01/
          if-no-files-found: error
