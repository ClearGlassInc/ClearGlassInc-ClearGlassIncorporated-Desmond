name: Apply ClearGlass visual restoration layer

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow validates the homepage only.
# It does not mutate the repository or push back to main.
permissions:
  contents: read

jobs:
  apply-visual-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate homepage restoration layer
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          if not p.is_file():
              raise SystemExit('index.html not found')
          text = p.read_text(encoding='utf-8')
          required = [
              '<link rel="stylesheet" href="sentinel.css"/>',
              '<link rel="stylesheet" href="clearglass-legacy-visual.css">',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('Required homepage restoration marker(s) missing: ' + ', '.join(missing))
          print('Homepage restoration layer validated; no repository mutation required.')

      - name: Validate required restoration asset
        shell: bash
        run: |
          set -euo pipefail
          test -f sentinel.css
          test -f clearglass-legacy-visual.css
          echo 'Required restoration assets present.'
