name: ARTEMIS Engineering CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/artemis-engineering/**'
      - '.github/workflows/artemis-engineering.yml'
  pull_request:
    paths:
      - 'apps/artemis-engineering/**'
      - '.github/workflows/artemis-engineering.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/artemis-engineering
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/artemis-engineering/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
