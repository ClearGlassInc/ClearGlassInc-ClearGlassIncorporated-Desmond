name: ARTEMIS Engineering CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/artemis-engineering/**'
      - '.github/workflows/artemis-engineering.yml'
  pull_request:
    paths:
      - 'apps/artemis-engineering/**'
      - '.github/workflows/artemis-engineering.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/artemis-engineering
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/artemis-engineering/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
