name: 4-D Web / SEO Optimizer

# Reusable domain workflow for the Web dimension of the 4-D Dominance pipeline.
# Runs the orchestrator in dry-run mode and prints the JSON report.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    name: Web domain dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Run 4-D web pipeline (dry-run)
        run: python -m four_d_dominance.pipeline --domain web --json
