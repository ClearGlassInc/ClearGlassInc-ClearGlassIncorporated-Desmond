name: CI

on:
  push:
    branches: ["main", "staging"]
  pull_request:
    branches: ["main", "staging"]
  # Manual on-demand runs from the Actions tab / API. auto-fix.yml also uses this
  # to re-run CI on a PR branch after it pushes a fix: a push made with
  # GITHUB_TOKEN does not trigger pull_request workflows, workflow_dispatch does.
  workflow_dispatch:

permissions:
  contents: read

# One live run per PR: a new push cancels the superseded run. Pushes get a group
# per commit, so no push to main or staging is ever cancelled or superseded and
# every merged commit keeps a result (and can be released).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      # 24 tests shell out to node and skip without it; the admin login guard
      # needs 22.6+ to strip TypeScript types. Pin it rather than inherit the
      # runner image's Node (tests/test_node_toolchain_guard.py).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: pip install pytest pytest-cov pyyaml
      - run: pytest tests/ --cov --cov-report=xml -q

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      # Pin ruff: an unpinned install lets CI pull a newer ruff whose expanded
      # default rule set flags hundreds of pre-existing style issues, turning
      # this repo-wide `ruff check .` red with no code change. Bump deliberately.
      - run: pip install "ruff==0.15.8"
      - run: ruff check .

  site-audit:
    name: Site Reliability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python scripts/site_reliability_audit.py

  search-integrity:
    name: Search discovery and structured data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate generated search assets are current
        run: |
          python3 tools/generate_search_assets.py
          git diff --exit-code -- sitemap.xml feed.xml data/seo/page-intents.json
      - name: Validate indexability, links, metadata, and JSON-LD
        run: python3 tools/seo_audit.py
      - name: Validate generated internal links
        run: python3 tools/internal_links.py --check
      - name: Validate the generated Insights hub
        run: python3 tools/insights_index.py --check

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Enforce performance, accessibility, and SEO budgets
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json

  workflow-doctor:
    name: Workflow Doctor (dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pyyaml
      - run: python scripts/workflow_doctor.py
      - name: Enforce workflow safety invariants
        run: python scripts/audit_github_actions.py

  osint-deck:
    name: OSINT Deck Validator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Fail-closed validation of the Ontario/Burlington OSINT deck: present,
      # indexable, intel.json valid, sitemap/nav/sw wired, inline JS + sw.js
      # syntax. Node ships on the runner, so the JS syntax checks run too.
      - run: python scripts/osint_deck_release.py --strict

  # ── Application stack (control-plane, storefront, admin) ──────────────────
  # Only components the change touches are built; scripts/ci/components.py owns
  # the component table and selects everything when it cannot tell.
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          # PR: diff against the base tip. Push: against the previous head.
          # workflow_dispatch has neither, which selects every component.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          python3 scripts/ci/components.py matrix --base "$BASE_SHA" --head HEAD | tee -a "$GITHUB_OUTPUT"

  stack:
    name: Stack (${{ matrix.component }})
    needs: changes
    if: needs.changes.outputs.any == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    uses: ./.github/workflows/reusable-component-ci.yml
    with:
      component: ${{ matrix.component }}
      language: ${{ matrix.language }}
      working-directory: ${{ matrix.path }}
      python-version: ${{ matrix.python-version }}
      node-version: ${{ matrix.node-version }}
      requirements: ${{ matrix.requirements }}
      python-format: ${{ matrix.python-format }}
      python-typecheck: ${{ matrix.python-typecheck }}

  # The single check to mark required in branch protection. Path-filtered and
  # matrix jobs that legitimately skip would otherwise leave a required check
  # "expected" forever; this one always reports, and passes only when every job
  # above succeeded or was skipped by design.
  result:
    name: CI result
    if: always()
    needs:
      - python-tests
      - lint
      - site-audit
      - search-integrity
      - lighthouse
      - workflow-doctor
      - osint-deck
      - changes
      - stack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded or been skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null || {
            echo "::error title=CI result::at least one CI job failed or was cancelled"
            exit 1
          }
