name: 4-D Brand / Content

# Reusable domain workflow for the Brand dimension of the 4-D Dominance pipeline.
# Runs the orchestrator in dry-run mode and prints the JSON report.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    name: Brand domain dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Run 4-D brand pipeline (dry-run)
        run: python -m four_d_dominance.pipeline --domain brand --json
