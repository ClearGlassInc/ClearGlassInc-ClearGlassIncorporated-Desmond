name: Dispatch All Workflows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to dispatch"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch manually-runnable workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install "pyyaml==6.0.3"
      - name: Dispatch every workflow_dispatch workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/dispatch_all_workflows.py --ref "${{ inputs.ref }}"
