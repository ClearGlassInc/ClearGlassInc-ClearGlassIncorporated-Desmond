name: Organic Growth — Daily Content

on:
  schedule:
    - cron: "0 12 * * *"  # 08:00 EDT / 12:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate content without creating issues"
        type: boolean
        default: false
      platform:
        description: "Primary platform focus"
        type: choice
        options:
          - x
          - linkedin
          - threads
          - all
        default: all

permissions:
  contents: read

concurrency:
  group: organic-daily
  cancel-in-progress: false

jobs:
  generate:
    name: Generate daily organic assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Ensure output directory
        run: mkdir -p marketing/output/organic

      - name: Run content engine (organic mode)
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          today = datetime.date.today().isoformat()
          out = Path('marketing/output/organic')
          out.mkdir(parents=True, exist_ok=True)
          pack = {
            'date': today,
            'platform_focus': os.environ['PLATFORM'],
            'assets': [
              {
                'id': f'organic-{today}-x',
                'platform': 'x',
                'pillar': 'technical-clarity',
                'hook': 'Most security teams still treat AI agents like scripts. That is the risk.',
                'body': 'Governed autonomy requires explicit capability boundaries, audit trails, and human approval gates. Anything less is theater.',
                'cta': 'What boundary do you enforce first?',
                'status': 'draft'
              },
              {
                'id': f'organic-{today}-linkedin',
                'platform': 'linkedin',
                'pillar': 'proof-authority',
                'hook': 'We stopped selling tools and started selling clarity.',
                'body': 'ClearGlass does not ship another dashboard. We harden, audit, and document existing systems so leaders can actually see risk and act.',
                'cta': 'DM me if you want the operating model.',
                'status': 'draft'
              }
            ],
            'repurpose_notes': 'Turn X post into LinkedIn first comment + Threads version. Save best replies for future content.'
          }
          (out / f'{today}.json').write_text(json.dumps(pack, indent=2))
          (out / f'{today}.md').write_text(f"# Organic Pack — {today}\n\n" + '\n\n'.join([f"### {a['platform'].upper()}\n**Hook:** {a['hook']}\n\n{a['body']}\n\nCTA: {a['cta']}" for a in pack['assets']]))
          print('Organic pack written')
          PY

      - name: Validate pack exists
        run: ls -la marketing/output/organic/ && test -f marketing/output/organic/$(date +%Y-%m-%d).json

      - name: Create tracking issue
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          gh issue create \
            --title "Organic Daily Pack — $DATE" \
            --body "$(cat marketing/output/organic/$DATE.md)" \
            --label "growth,organic,content"
