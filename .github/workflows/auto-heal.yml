name: Auto Heal

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Local non-destructive heal probe
        run: |
          set -euo pipefail
          echo "ClearGlass auto-heal local probe"
          echo "Homepage and production site files will not be mutated."
          echo "event=${GITHUB_EVENT_NAME}"
