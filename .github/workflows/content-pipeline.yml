name: Content Pipeline

on:
  workflow_run:
    workflows: ["Bot Orchestrator"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  validate-and-commit:
    name: Validate & Commit Generated Content
    permissions:
      contents: write
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: automation-write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # Required only for this job's audited git push.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate content outputs
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          ROOT = Path(".")
          errors = []
          for fname in ["operations/output/orchestrator_summary.json",
                        "operations/output/site_health_report.json"]:
              p = ROOT / fname
              if p.exists():
                  try:
                      json.loads(p.read_text())
                  except json.JSONDecodeError as e:
                      errors.append(f"Invalid JSON in {fname}: {e}")
          if errors:
              for e in errors:
                  print(f"ERROR: {e}", file=sys.stderr)
              sys.exit(1)
          print(f"Validated {len(list((ROOT / 'operations/output').glob('*.json')))} JSON output files")
          PY

      - name: Detect content changes
        id: detect
        run: |
          git add marketing/output/ operations/output/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No content changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            CHANGED_FILES=$(git diff --staged --name-only | head -20 | tr '\n' ' ')
            echo "files=$CHANGED_FILES" >> "$GITHUB_OUTPUT"
            echo "Changed files: $CHANGED_FILES"
          fi

      - name: Commit content updates
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TS=$(date -u "+%Y-%m-%d %H:%M UTC")
          git commit -m "content: auto-update generated outputs — $TS [skip ci]"
          # Concurrent bots push to main during our run; a plain push hits a
          # non-fast-forward rejection. Rebase onto the latest main and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              echo "Content committed and pushed"
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — rebasing onto latest main"
            git pull --rebase origin main
          done
          echo "::error::Failed to push content updates after 5 attempts"
          exit 1
