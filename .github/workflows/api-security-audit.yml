name: API Security Audit

on:
  # Scheduled: weekly on Monday 03:00 UTC
  schedule:
    - cron: "0 3 * * 1"
  # Manual trigger with environment selection
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment base URL (staging/dev only)"
        required: true
        default: "https://staging-api.clearglassinc.com"
      endpoints_file:
        description: "Path to endpoint definitions JSON"
        required: false
        default: "security/endpoints_example.json"
      allow_empty_report:
        description: "Allow scanner/no-report runs for connectivity dry-runs only"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  api-security-audit:
    name: Defensive Authorization Audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging   # requires environment-level secret approval
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Validate target is not production
        env:
          INPUT_TARGET_ENV: ${{ github.event.inputs.target_env || 'https://staging-api.clearglassinc.com' }}
          INPUT_ENDPOINTS_FILE: ${{ github.event.inputs.endpoints_file || 'security/endpoints_example.json' }}
        run: |
          set -euo pipefail
          TARGET="$INPUT_TARGET_ENV"
          ENDPOINTS="$INPUT_ENDPOINTS_FILE"

          case "$TARGET" in
            https://staging-api.clearglassinc.com|https://dev-api.clearglassinc.com)
              ;;
            *)
              echo "::error::Refusing to audit unapproved API target '$TARGET'. Use the staging or dev allowlist."
              exit 1
              ;;
          esac

          if [[ "$ENDPOINTS" = /* || "$ENDPOINTS" = *".."* || "$ENDPOINTS" != *.json ]]; then
            echo "::error::endpoints_file must be a repo-relative JSON path without '..'."
            exit 1
          fi
          if [ ! -f "$ENDPOINTS" ]; then
            echo "::error::Endpoint definition file '$ENDPOINTS' was not found."
            exit 1
          fi
          {
            echo "TARGET_URL=$TARGET"
            echo "ENDPOINTS_FILE=$ENDPOINTS"
          } >> "$GITHUB_ENV"

      - name: Run API Security Scanner
        env:
          AUDIT_VALID_TOKEN: ${{ secrets.AUDIT_VALID_TOKEN }}
          AUDIT_LOW_PRIV_TOKEN: ${{ secrets.AUDIT_LOW_PRIV_TOKEN }}
          AUDIT_OTHER_USER_ID: ${{ secrets.AUDIT_OTHER_USER_ID }}
        run: |
          python scripts/api_security_scanner.py \
            --base-url "$TARGET_URL" \
            --endpoints "$ENDPOINTS_FILE" \
            --valid-token "$AUDIT_VALID_TOKEN" \
            --low-priv-token "$AUDIT_LOW_PRIV_TOKEN" \
            --other-user-id "$AUDIT_OTHER_USER_ID" \
            --output-dir audit-reports \
            --timeout 12

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-audit-report-${{ github.run_id }}
          path: audit-reports/api_audit_*.json
          retention-days: 90

      - name: Upload CSV report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-audit-csv-${{ github.run_id }}
          path: audit-reports/api_audit_*.csv
          retention-days: 90

      - name: Parse results and set job summary
        id: parse
        run: |
          REPORT=$(ls audit-reports/api_audit_*.json 2>/dev/null | head -1 || true)
          if [ -z "$REPORT" ]; then
            # No report means the scanner did not complete or could not reach
            # the target. Fail closed unless the run was explicitly dispatched
            # as a connectivity dry-run.
            if [ "${{ github.event.inputs.allow_empty_report || 'false' }}" = "true" ]; then
              echo "::warning::No audit report produced; allow_empty_report=true, so this manual dry-run will not fail."
              echo "failures=0" >> "$GITHUB_OUTPUT"
              echo "risk=UNKNOWN" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::No audit report produced — scanner did not complete or required staging secrets are unset."
            echo "failures=0" >> $GITHUB_OUTPUT
            echo "risk=UNKNOWN" >> $GITHUB_OUTPUT
            {
              echo "## API Security Audit — ${{ env.TARGET_URL }}";
              echo;
              echo "⚠️ No report generated (target unreachable or secrets unset). Nothing to assess.";
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          FAILURES=$(python3 -c "import json,sys; d=json.load(open('$REPORT')); print(d['summary']['failed'])")
          RISK=$(python3 -c "import json,sys; d=json.load(open('$REPORT')); print(d['summary']['risk_rating'])")
          TOTAL=$(python3 -c "import json,sys; d=json.load(open('$REPORT')); print(d['summary']['total_tests'])")
          PASSED=$(python3 -c "import json,sys; d=json.load(open('$REPORT')); print(d['summary']['passed'])")
          echo "failures=$FAILURES" >> $GITHUB_OUTPUT
          echo "risk=$RISK" >> $GITHUB_OUTPUT

          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## API Security Audit — ${{ env.TARGET_URL }}

          | Metric | Value |
          |---|---|
          | Total tests | $TOTAL |
          | Passed | $PASSED |
          | Failed | $FAILURES |
          | Risk rating | $RISK |

          $(if [ "$FAILURES" -gt 0 ]; then echo "⚠️ **$FAILURES authorization failure(s) detected — review the artifacts.**"; else echo "✅ All authorization tests passed."; fi)
          EOF

      - name: Open issue on failure
        if: steps.parse.outputs.failures != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const failures = '${{ steps.parse.outputs.failures }}';
            const risk = '${{ steps.parse.outputs.risk }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[API Security Audit] ${failures} authorization failure(s) — Risk: ${risk}`,
              body: [
                '## API Security Audit Failure',
                '',
                `**Run:** [${context.runId}](${runUrl})`,
                `**Risk rating:** ${risk}`,
                `**Failures:** ${failures}`,
                '',
                'Review the audit artifacts attached to the workflow run.',
                'Fix all CRITICAL and HIGH findings before the next scheduled audit.',
                '',
                '**References:**',
                '- [OWASP API Security Top 10](https://owasp.org/API-Security/)',
                '- `security/api_audit_report_schema.json`',
                '- `prompts/api_security_audit_prompt.md`',
              ].join('\n'),
              labels: ['security', 'api-audit', risk.toLowerCase()],
            });

      - name: Fail the job if audit found failures
        if: steps.parse.outputs.failures != '0'
        run: |
          echo "::error::API security audit found ${{ steps.parse.outputs.failures }} failure(s). Risk: ${{ steps.parse.outputs.risk }}"
          exit 1
