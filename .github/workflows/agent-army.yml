name: Agent Army Validation

on:
  pull_request:
    branches: ["main"]
    paths:
      - "agent_army/**"
      - "tests/test_agent_army.py"
      - ".github/workflows/agent-army.yml"
  push:
    branches: ["main"]
    paths:
      - "agent_army/**"
      - "tests/test_agent_army.py"
      - ".github/workflows/agent-army.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-army-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate governed orchestration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run focused unit tests
        run: python -m unittest tests.test_agent_army -v

      - name: Generate governed sample plan
        run: |
          python -m agent_army.orchestrator \
            --request "Build and test a secure service, then prepare a compliant revenue campaign" \
            --format json \
            --output /tmp/agent-army-plan.json
          python -m json.tool /tmp/agent-army-plan.json >/dev/null

      - name: Verify approval gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/agent-army-plan.json").read_text())
          assert payload["steps"], "execution plan must contain steps"
          assert "staff_engineer" in payload["selected_agents"]
          assert "revenue_operator" in payload["selected_agents"]
          print("Agent-army validation passed.")
          PY
