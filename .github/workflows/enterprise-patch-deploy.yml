# ClearGlass Enterprise Patch & Deploy — org reusable control plane.
#
# Read-only analysis -> draft -> human approval -> execution, with an immutable
# audit trail. One skeleton applied to every ClearGlassInc repo via a thin caller
# that passes this repo's `.github/patch-deploy.yml` inputs.
#
# Design + wiring: docs/ENTERPRISE_PATCH_DEPLOY.md
# Triage/gate math (unit-tested): scripts/patch_deploy/risk_score.py
#
# Call it from a sibling repo (pin to a SHA, not a moving ref):
#   jobs:
#     patch-deploy:
#       uses: ClearGlassInc/ClearGlassInc.github.io/.github/workflows/enterprise-patch-deploy.yml@<sha>
#       with:
#         change_type: dependency_bump
#         target_env: staging
#       secrets: inherit
name: ClearGlass Enterprise Patch & Deploy

on:
  workflow_call:
    inputs:
      change_type:
        description: "Change class (dependency_bump, app_release, security_hotfix, config_change, secret_rotation, ...)."
        required: true
        type: string
      target_env:
        description: "Terminal environment for this run (staging | production)."
        required: false
        type: string
        default: staging
      cvss:
        description: "CVSS 0..10 for security changes; 0 otherwise."
        required: false
        type: number
        default: 0
      confidence:
        description: "Pre-computed confidence 0..1 from upstream signals; validation recomputes it."
        required: false
        type: number
        default: 1
      content_ref:
        description: "Diff/lockfile/commit digest — seeds the idempotent change_id."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Read-only: run triage + validation, never deploy. Default for new change types."
        required: false
        type: boolean
        default: true
      python-version:
        required: false
        type: string
        default: "3.11"
    outputs:
      change_id:
        description: "Idempotent id for this change."
        value: ${{ jobs.triage.outputs.change_id }}
      verdict:
        description: "autonomous | approval | hard_stop"
        value: ${{ jobs.triage.outputs.verdict }}
      risk_class:
        description: "low | medium | high | critical"
        value: ${{ jobs.triage.outputs.risk_class }}

# Least-privilege at the top; individual jobs widen only what they need.
permissions:
  contents: read

# One in-flight run per repo+environment (doc §3 concurrency groups).
concurrency:
  group: patch-deploy-${{ github.repository }}-${{ inputs.target_env }}
  cancel-in-progress: false

jobs:
  # 1-2. Intake + Triage -----------------------------------------------------
  triage:
    name: Intake + triage (risk score + gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      change_id: ${{ steps.score.outputs.change_id }}
      verdict: ${{ steps.score.outputs.verdict }}
      risk_class: ${{ steps.score.outputs.risk_class }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Resolve inventory path
        id: inv
        run: |
          # Prefer a live inventory; fall back to the committed example so the
          # gate still runs (missing rows are scored worst-case by design).
          if [[ -f .github/enterprise-patch-deploy/repo-inventory.json ]]; then
            echo "path=.github/enterprise-patch-deploy/repo-inventory.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No live repo-inventory.json — using committed example (worst-case for unknown repos)."
            echo "path=.github/enterprise-patch-deploy/repo-inventory.example.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Score change and decide gate
        id: score
        run: |
          repo_short="${GITHUB_REPOSITORY##*/}"
          # The CLI writes the JSON record to stdout, gate outputs to
          # $GITHUB_OUTPUT, and encodes the verdict in its exit code
          # (0=autonomous 1=approval 2=hard_stop). Capture rc without letting a
          # non-zero verdict abort the step — the Hard stop step handles halting.
          set +e
          python scripts/patch_deploy/risk_score.py \
            --repo "$repo_short" \
            --change-type "${{ inputs.change_type }}" \
            --content-ref "${{ inputs.content_ref || github.sha }}" \
            --cvss "${{ inputs.cvss }}" \
            --target-env "${{ inputs.target_env }}" \
            --confidence "${{ inputs.confidence }}" \
            --inventory "${{ steps.inv.outputs.path }}" \
            --github-output > intake.json
          rc=$?
          set -e
          cat intake.json
          echo "Gate exit code: ${rc} (0=autonomous 1=approval 2=hard_stop 3=input-error)"
          if [[ "${rc}" == "3" ]]; then
            echo "::error::Triage input error — check change_type / inventory."
            exit 1
          fi
      - name: Persist intake record
        run: |
          mkdir -p audit
          cp intake.json "audit/intake-${{ steps.score.outputs.change_id }}.json"
      - name: Upload intake audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-deploy-intake-${{ steps.score.outputs.change_id }}
          path: audit/
          retention-days: 400
      - name: Job summary
        run: |
          {
            echo "### Triage — \`${{ inputs.change_type }}\` on \`${{ github.repository }}\`"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| change_id | \`${{ steps.score.outputs.change_id }}\` |"
            echo "| risk_class | **${{ steps.score.outputs.risk_class }}** |"
            echo "| score | ${{ steps.score.outputs.score }} |"
            echo "| verdict | **${{ steps.score.outputs.verdict }}** |"
            echo "| dry_run | ${{ inputs.dry_run }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Hard stop
        if: steps.score.outputs.verdict == 'hard_stop'
        run: |
          echo "::error::Gate verdict is HARD STOP — halting before validation (doc §4 stop-loss)."
          exit 1

  # 3. Validation (isolated, dry-run) ---------------------------------------
  validate:
    name: Validate (unit + policy + supply-chain)
    needs: triage
    if: needs.triage.outputs.verdict != 'hard_stop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: validation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Load per-repo config
        id: cfg
        run: |
          cfg=".github/patch-deploy.yml"
          if [[ -f "$cfg" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No .github/patch-deploy.yml — running default validation only."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run repo validation commands
        if: steps.cfg.outputs.found == 'true'
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/cmds.txt
          import sys, yaml
          cfg = yaml.safe_load(open(".github/patch-deploy.yml")) or {}
          for c in (cfg.get("validation", {}) or {}).get("commands", []) or []:
              print(c)
          PY
          if [[ -s /tmp/cmds.txt ]]; then
            # Flaky re-runs: attempt each command up to 3x (doc §6).
            while IFS= read -r cmd; do
              [[ -z "$cmd" ]] && continue
              echo "::group::validate: $cmd"
              n=0
              until bash -c "$cmd"; do
                n=$((n+1)); [[ $n -ge 3 ]] && { echo "::error::validation failed after $n tries: $cmd"; exit 1; }
                echo "retry $n ..."
              done
              echo "::endgroup::"
            done < /tmp/cmds.txt
          else
            echo "No repo validation commands configured."
          fi
      - name: Confidence check
        run: |
          echo "Validation gate passed. Confidence input: ${{ inputs.confidence }} (autonomous >= 0.92)."

  # 4. Staging (deploy + smoke + soak) --------------------------------------
  staging:
    name: Staging deploy + smoke
    needs: [triage, validate]
    if: needs.triage.outputs.verdict != 'hard_stop' && inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write # OIDC — short-lived creds, no long-lived secrets
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Deploy to staging (adapter)
        run: echo "Deploy candidate ${{ needs.triage.outputs.change_id }} to staging via configured adapter."
      - name: Smoke + synthetic probes
        run: echo "Run smoke/synthetic checks; fail this step to trigger rollback."

  # 5a. Canary (requires 1 approver via environment protection) -------------
  canary:
    name: Canary (progressive traffic)
    needs: [triage, staging]
    if: needs.triage.outputs.verdict != 'hard_stop' && inputs.dry_run == false && inputs.target_env == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-canary # reviewers configured on the GitHub Environment
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Shift canary slice
        run: echo "Route 5-20% traffic to change ${{ needs.triage.outputs.change_id }}; observe."

  # 5b. Promote to production (2nd approver for high/critical) ---------------
  promote:
    name: Promote to production
    needs: [triage, canary]
    if: needs.triage.outputs.verdict != 'hard_stop' && inputs.dry_run == false && inputs.target_env == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production # add a 2nd required reviewer for high/critical on the Environment
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Full promotion
        run: echo "Promote change ${{ needs.triage.outputs.change_id }} to 100%."

  # 6. Verification (soak + continuous probes) ------------------------------
  verify:
    name: Post-deploy verification
    needs: [triage, promote]
    if: always() && needs.promote.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Soak + recompute confidence
        run: echo "Observe soak window; recompute confidence; any stop-loss => rollback job runs."

  # 7. Rollback (automatic on any failure) ----------------------------------
  rollback:
    name: Automatic rollback
    needs: [triage, staging, canary, promote, verify]
    if: always() && inputs.dry_run == false && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Roll back to last known-good
        run: |
          echo "::warning::Rollback triggered for change ${{ needs.triage.outputs.change_id }}."
          echo "Execute configured rollback strategy; MUST verify health before marking success."
      - name: Escalate if rollback fails
        if: failure()
        run: echo "::error::Rollback failed — freeze changes and page on-call (doc §8)."

  # 8. Post-deploy review (immutable audit record) --------------------------
  audit:
    name: Immutable audit record
    needs: [triage, validate, staging, canary, promote, verify, rollback]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Assemble change record
        run: |
          mkdir -p audit
          generated_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > "audit/change-record-${{ needs.triage.outputs.change_id }}.json" <<JSON
          {
            "change_id": "${{ needs.triage.outputs.change_id }}",
            "repository": "${{ github.repository }}",
            "actor": "${{ github.actor }}",
            "change_type": "${{ inputs.change_type }}",
            "target_env": "${{ inputs.target_env }}",
            "risk_class": "${{ needs.triage.outputs.risk_class }}",
            "verdict": "${{ needs.triage.outputs.verdict }}",
            "dry_run": ${{ inputs.dry_run }},
            "results": {
              "triage": "${{ needs.triage.result }}",
              "validate": "${{ needs.validate.result }}",
              "staging": "${{ needs.staging.result }}",
              "canary": "${{ needs.canary.result }}",
              "promote": "${{ needs.promote.result }}",
              "verify": "${{ needs.verify.result }}",
              "rollback": "${{ needs.rollback.result }}"
            },
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "commit": "${{ github.sha }}",
            "generated_utc": "${generated_utc}"
          }
          JSON
      - name: Upload immutable audit record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-deploy-audit-${{ needs.triage.outputs.change_id }}
          path: audit/
          retention-days: 400 # >= 1 year (doc §10)
      - name: Audit completeness check
        run: |
          if [[ "${{ needs.triage.result }}" != "success" ]]; then
            echo "::warning::Triage did not succeed — audit trail may be incomplete."
          fi
          echo "Change record archived for ${{ needs.triage.outputs.change_id }}."
