name: Workflow Doctor

on:
  schedule:
    - cron: "0 3 * * 1"   # Monday 03:00 UTC — weekly audit + auto-repair
  push:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Audit (every trigger) ────────────────────────────────────────────────────
  audit:
    name: Audit Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install "pyyaml==6.0.3"
      - name: Dry-run workflow doctor
        run: python scripts/workflow_doctor.py
      - name: Enforce workflow safety invariants
        run: python scripts/audit_github_actions.py

  # ── Auto-repair (schedule and manual dispatch only) ──────────────────────────
  repair:
    name: Auto-repair Workflows
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: automation-write
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: true # Required only for this job's audited git push.
          ref: main

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install "pyyaml==6.0.3"

      - name: Apply workflow repairs
        id: doctor
        run: |
          python scripts/workflow_doctor.py --fix
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Establish repair branch
        if: steps.doctor.outputs.changed == 'true'
        run: |
          # Reset the disposable repair branch to main on the remote so the
          # signing action can add its commit on top, then stage (don't commit)
          # the repairs for it. Working-tree edits from --fix stay uncommitted.
          git push -f origin "HEAD:refs/heads/bot/workflow-doctor-repair"
          git add .github/workflows/

      - name: Commit repairs (Verified)
        if: steps.doctor.outputs.changed == 'true'
        uses: ./.github/actions/verified-commit
        with:
          paths: .github/workflows
          message: "fix(ci): repair GitHub Actions workflows [auto]"
          branch: bot/workflow-doctor-repair

      - name: Open repair PR
        if: steps.doctor.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error

          token = os.environ["GH_TOKEN"]
          repo  = os.environ["REPO"]

          payload = json.dumps({
            "title": "fix(ci): auto-repair GitHub Actions workflows",
            "head":  "bot/workflow-doctor-repair",
            "base":  "main",
            "body": (
              "Automated workflow repair by the Workflow Doctor bot.\n\n"
              "### What changed\n"
              "Run `git diff main...bot/workflow-doctor-repair` to inspect exact changes.\n\n"
              "### Rollback\n"
              "Close this PR without merging to reject all repairs."
            ),
          }).encode()

          req = urllib.request.Request(
            f"https://api.github.com/repos/{repo}/pulls",
            data=payload,
            headers={
              "Authorization":       f"Bearer {token}",
              "Accept":              "application/vnd.github+json",
              "Content-Type":        "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
            },
            method="POST",
          )
          try:
            with urllib.request.urlopen(req) as resp:
              pr = json.loads(resp.read())
            print(f"PR created: {pr['html_url']}")
          except urllib.error.HTTPError as exc:
            body = exc.read().decode()
            if "already exists" in body or "A pull request already exists" in body:
              print("Repair PR already open — skipping creation")
            else:
              raise
          PYEOF
