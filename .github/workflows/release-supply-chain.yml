name: Release Supply Chain

# Reusable cryptographic supply-chain pipeline (SLSA L3). Build -> SBOM ->
# keyless signature (Sigstore, no long-lived keys) -> build-provenance
# attestation. Call from a tag-triggered caller workflow in any service repo:
#
#   jobs:
#     release:
#       uses: ClearGlassInc/.github/.github/workflows/release-supply-chain.yml@<sha>
#       with:
#         image: ghcr.io/clearglassinc/artemis
#       permissions:
#         contents: read
#         id-token: write
#         packages: write
#         attestations: write

on:
  workflow_call:
    inputs:
      image:
        description: "Fully-qualified image name (no tag)."
        required: true
        type: string
      context:
        description: "Docker build context."
        required: false
        default: "."
        type: string

permissions:
  contents: read

jobs:
  build-sign-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC for keyless signing + provenance
      packages: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (by digest)
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcd730101868d # v6.9.0
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ inputs.image }}:${{ github.ref_name }}

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Attest build provenance (SLSA L3)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless sign
        run: cosign sign --yes "${{ inputs.image }}@${{ steps.build.outputs.digest }}"
