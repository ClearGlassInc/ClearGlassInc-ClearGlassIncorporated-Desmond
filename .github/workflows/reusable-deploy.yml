name: Reusable Deploy

# Deploy one commit to one protected environment, then prove it is serving
# (AUTOMATION.md §5). Called by deploy-promotion.yml and deploy-staging.yml.
#
# Two providers, chosen by the repository variable DEPLOY_PROVIDER:
#
# render (default, also when unset) — the mechanism this repo already uses
# (rollback.yml, commerce-deploy.yml): a Render deploy hook, POSTed with
# ?ref=<full SHA>. Everything it needs is environment-scoped, so the job's
# environment binding decides which service is hit:
#
#   secret RENDER_DEPLOY_HOOK   the environment's deploy hook URL (holds a key; never echoed)
#   secret RENDER_API_KEY       optional; lets the job wait for the deploy to go live
#   var    DEPLOY_BASE_URL      https base URL of that environment's control plane
#
# Without RENDER_API_KEY the job cannot tell when the new revision is live, so it
# waits settle_seconds and the smoke test may still be answered by the previous
# revision. No automatic rollback on Render: docs/INCIDENT_RESPONSE.md (a redeploy
# can flap between two broken states). On failure this job names the last
# known-good commit and the exact Rollback dispatch; a human runs it.
#
# cloudrun — OIDC only: the job exchanges its GitHub-signed token for a
# short-lived credential bound to THIS environment's service account, so no
# long-lived cloud key exists anywhere. scripts/ci/release.py builds once (or
# reuses staging's digest in production), deploys candidate revisions with no
# traffic, smoke-tests them, promotes in dependency order, smoke-tests live, and
# — only when auto_rollback is set — routes traffic back to the previous revision.
# A traffic switch is a single shot that cannot flap; it is still withheld when
# the release ships migrations (deploy-promotion.yml decides). Environment
# variables: GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, DEPLOY_PROJECT,
# DEPLOY_REGION, IMAGE_REPOSITORY.

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment: staging or production (preview: cloudrun only)."
        required: true
        type: string
      ref:
        description: "Full 40-character commit SHA to deploy."
        required: true
        type: string
      run_smoke:
        description: "Poll /health and check /ready after the deploy."
        required: false
        type: boolean
        default: true
      run_e2e:
        description: "Extended read-only checks: admin auth enabled and the admin ledger refuses anonymous reads."
        required: false
        type: boolean
        default: false
      settle_seconds:
        description: "Wait used only when RENDER_API_KEY is absent."
        required: false
        type: number
        default: 180
      rollback_hint_ref:
        description: "Last known-good commit, quoted in the failure summary for the manual Rollback workflow."
        required: false
        type: string
        default: ""
      services:
        description: "cloudrun: comma-separated components to release (scripts/ci/components.py)."
        required: false
        type: string
        default: "control-plane"
      build:
        description: "cloudrun: build and push the image (staging, previews). Production reuses staging's digest."
        required: false
        type: boolean
        default: false
      tag:
        description: "cloudrun: revision tag (pr-<n> for previews). Default sha-<short ref>."
        required: false
        type: string
        default: ""
      promote:
        description: "cloudrun: move traffic to the new revisions. Previews never do."
        required: false
        type: boolean
        default: true
      auto_rollback:
        description: "cloudrun: route traffic back automatically if a promoted service fails."
        required: false
        type: boolean
        default: false
    outputs:
      deploy_url:
        description: "Base URL of the deployed environment (the control plane's, when it was released)."
        value: ${{ jobs.deploy.outputs.deploy_url }}
      urls:
        description: "JSON map of service -> URL."
        value: ${{ jobs.deploy.outputs.urls }}
      outcome:
        description: "cloudrun: success | failed | rolled-back."
        value: ${{ jobs.deploy.outputs.outcome }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.target.outputs.deploy_url || steps.release.outputs.primary_url }}
    permissions:
      contents: read
      id-token: write # cloudrun's OIDC exchange; unused on render
    env:
      PROVIDER: ${{ vars.DEPLOY_PROVIDER || 'render' }}
    outputs:
      deploy_url: ${{ steps.target.outputs.deploy_url || steps.release.outputs.primary_url }}
      urls: ${{ steps.target.outputs.urls || steps.release.outputs.urls }}
      outcome: ${{ steps.release.outputs.outcome }}
    steps:
      - name: Checkout (local actions and release scripts, default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse an unknown provider
        run: |
          case "$PROVIDER" in
            render|cloudrun) echo "Deploy provider: $PROVIDER" ;;
            *) echo "::error::DEPLOY_PROVIDER must be render or cloudrun, got '$PROVIDER'"; exit 1 ;;
          esac

      # ── render ─────────────────────────────────────────────────────────────
      - name: Validate inputs and resolve the target
        if: env.PROVIDER == 'render'
        id: target
        env:
          TARGET_ENV: ${{ inputs.environment }}
          TARGET_REF: ${{ inputs.ref }}
          DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
        run: |
          set -euo pipefail
          case "$TARGET_ENV" in
            staging|production) ;;
            *) echo "::error::environment must be staging or production, got '${TARGET_ENV}'"; exit 1 ;;
          esac
          # A branch or tag can move between approval and deploy; a full SHA cannot.
          if ! printf '%s' "$TARGET_REF" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::ref must be a full 40-character commit SHA, got '${TARGET_REF}'"
            exit 1
          fi
          if [ -z "${DEPLOY_BASE_URL:-}" ]; then
            echo "::error::DEPLOY_BASE_URL is not set in the '${TARGET_ENV}' environment (Settings -> Environments -> ${TARGET_ENV} -> Variables)."
            exit 1
          fi
          echo "deploy_url=${DEPLOY_BASE_URL%/}" >> "$GITHUB_OUTPUT"
          printf 'urls={"control-plane":"%s"}\n' "${DEPLOY_BASE_URL%/}" >> "$GITHUB_OUTPUT"

      - name: Trigger the deploy hook
        if: env.PROVIDER == 'render'
        id: hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          TARGET_ENV: ${{ inputs.environment }}
          TARGET_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK is not set in the '${TARGET_ENV}' environment's secrets."
            exit 1
          fi
          # Render hook URLs already carry ?key=..., so ref is appended with '&'.
          case "$RENDER_DEPLOY_HOOK" in *\?*) sep='&' ;; *) sep='?' ;; esac
          curl --fail --silent --show-error --location --max-time 60 \
            --output /tmp/cg-hook.json \
            "${RENDER_DEPLOY_HOOK}${sep}ref=${TARGET_REF}"
          deploy_id="$(python3 -c 'import json; print((json.load(open("/tmp/cg-hook.json")).get("deploy") or {}).get("id",""))' 2>/dev/null || true)"
          echo "deploy_id=${deploy_id}" >> "$GITHUB_OUTPUT"
          echo "Deploy of ${TARGET_REF} requested in ${TARGET_ENV}${deploy_id:+ (deploy ${deploy_id})}."

      - name: Wait for the new revision to go live
        if: env.PROVIDER == 'render'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ steps.hook.outputs.deploy_id }}
          SETTLE_SECONDS: ${{ inputs.settle_seconds }}
        run: |
          set -euo pipefail
          service_id="$(printf '%s' "$RENDER_DEPLOY_HOOK" | grep -oE 'srv-[a-z0-9]+' | head -n1 || true)"
          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${DEPLOY_ID:-}" ] || [ -z "$service_id" ]; then
            echo "::warning::Cannot track the deploy (RENDER_API_KEY, deploy id or service id missing). Waiting ${SETTLE_SECONDS}s; the smoke test may reach the previous revision."
            sleep "$SETTLE_SECONDS"
            exit 0
          fi
          export SERVICE_ID="$service_id"
          python3 - <<'PY'
          import json, os, sys, time, urllib.request
          url = f"https://api.render.com/v1/services/{os.environ['SERVICE_ID']}/deploys/{os.environ['DEPLOY_ID']}"
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['RENDER_API_KEY']}",
              "Accept": "application/json",
          })
          failed = {"build_failed", "update_failed", "canceled", "pre_deploy_failed", "deactivated"}
          for attempt in range(1, 121):
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = json.load(response).get("status", "")
              print(f"attempt {attempt}: deploy status {status!r}")
              if status == "live":
                  sys.exit(0)
              if status in failed:
                  print(f"::error::Render reports the deploy as {status}.")
                  sys.exit(1)
              time.sleep(15)
          print("::error::Deploy did not go live within 30 minutes.")
          sys.exit(1)
          PY

      - name: Smoke tests
        if: env.PROVIDER == 'render' && inputs.run_smoke
        uses: ./.github/actions/run-smoke-tests
        with:
          base_url: ${{ steps.target.outputs.deploy_url }}
          check_ready: "true"
          expect_admin_auth: ${{ inputs.run_e2e && 'true' || 'false' }}

      - name: Record the rollback path
        if: failure() && env.PROVIDER == 'render'
        env:
          TARGET_ENV: ${{ inputs.environment }}
          TARGET_REF: ${{ inputs.ref }}
          ROLLBACK_REF: ${{ inputs.rollback_hint_ref }}
        run: |
          {
            echo "## Deploy to ${TARGET_ENV} failed"
            echo
            echo "- Failed revision: \`${TARGET_REF}\`"
            if [ -n "${ROLLBACK_REF}" ]; then
              echo "- Last known-good revision: \`${ROLLBACK_REF}\`"
              echo
              echo "Do not roll forward. Run **Actions -> Rollback -> Run workflow** with"
              echo "\`target_sha=${ROLLBACK_REF}\` and \`surface=control-plane\`, per docs/INCIDENT_RESPONSE.md."
            else
              echo "- No known-good revision was recorded for ${TARGET_ENV}; pick one from its deployment history."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ── cloudrun ───────────────────────────────────────────────────────────
      - name: Check out the commit being released (build context only)
        if: env.PROVIDER == 'cloudrun'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: source
          persist-credentials: false

      - name: Refuse an incomplete environment
        if: env.PROVIDER == 'cloudrun'
        env:
          TARGET_ENV: ${{ inputs.environment }}
          TARGET_REF: ${{ inputs.ref }}
          WIF: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SA: ${{ vars.GCP_SERVICE_ACCOUNT }}
          DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT }}
          DEPLOY_REGION: ${{ vars.DEPLOY_REGION }}
          IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
        run: |
          set -euo pipefail
          case "$TARGET_ENV" in
            preview|staging|production) ;;
            *) echo "::error::environment must be preview, staging or production, got '${TARGET_ENV}'"; exit 1 ;;
          esac
          if ! printf '%s' "$TARGET_REF" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::ref must be a full 40-character commit SHA, got '${TARGET_REF}'"
            exit 1
          fi
          missing=()
          for name in WIF SA DEPLOY_PROJECT DEPLOY_REGION IMAGE_REPOSITORY; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::the '${TARGET_ENV}' environment is missing: ${missing[*]} (AUTOMATION.md §5)"
            exit 1
          fi

      - name: Authenticate to Google Cloud (OIDC, Workload Identity Federation)
        if: env.PROVIDER == 'cloudrun'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Let docker use the short-lived credential for the registry
        if: env.PROVIDER == 'cloudrun'
        env:
          IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
        run: gcloud auth configure-docker "${IMAGE_REPOSITORY%%/*}" --quiet

      - name: Release
        id: release
        if: env.PROVIDER == 'cloudrun'
        env:
          DEPLOY_PROVIDER: cloudrun
          DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT }}
          DEPLOY_REGION: ${{ vars.DEPLOY_REGION }}
          IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
          SERVICE_PREFIX: ${{ vars.SERVICE_PREFIX || 'cg' }}
          TARGET_ENV: ${{ inputs.environment }}
          TARGET_REF: ${{ inputs.ref }}
          SERVICES: ${{ inputs.services }}
          TAG: ${{ inputs.tag }}
          BUILD: ${{ inputs.build }}
          PROMOTE: ${{ inputs.promote }}
          AUTO_ROLLBACK: ${{ inputs.auto_rollback }}
        run: |
          set -euo pipefail
          args=(--environment "$TARGET_ENV" --services "$SERVICES" --sha "$TARGET_REF"
                --tag "${TAG:-sha-${TARGET_REF:0:7}}" --image-repository "$IMAGE_REPOSITORY"
                --service-prefix "$SERVICE_PREFIX" --source source --out release.json)
          if [ "$BUILD" = "true" ]; then args+=(--build); fi
          if [ "$PROMOTE" = "true" ] && [ "$TARGET_ENV" != "preview" ]; then args+=(--promote); fi
          if [ "$AUTO_ROLLBACK" = "true" ]; then args+=(--auto-rollback); fi
          python3 scripts/ci/release.py "${args[@]}"

      - name: Keep the release record
        if: always() && env.PROVIDER == 'cloudrun'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ inputs.environment }}-${{ inputs.tag || inputs.ref }}
          path: release.json
          if-no-files-found: ignore
          retention-days: 90
