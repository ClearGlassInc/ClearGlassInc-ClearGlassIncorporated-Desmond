name: Intelligence Graph

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: intelligence-graph
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable baseline
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install graph runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/intelligence_graph_requirements.txt
          python -m playwright install chromium
      - name: Run multi-source collector
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CG_GRAPH_GITHUB_REF: main
          CG_GRAPH_RENDERED_DOM: "1"
        run: python3 tools/site_intelligence_graph.py crawl
      - name: Verify tamper detection and chain
        run: |
          python3 tools/site_intelligence_graph.py self-test
          python3 tools/verify_site_graph_chain.py
      - name: Commit verified graph artifacts
        run: |
          git config user.name "ClearGlass Intelligence Graph"
          git config user.email "actions@users.noreply.github.com"
          git add data/intelligence-graph
          if git diff --cached --quiet; then
            echo "No graph artifact delta."
          else
            git commit -m "Update verified ClearGlass intelligence graph"
            git push origin HEAD:main
          fi
