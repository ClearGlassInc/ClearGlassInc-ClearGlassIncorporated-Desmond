name: Shield Billing Lock

on:
  pull_request:
    paths:
      - "shield.html"
      - "assets/js/**"
      - "assets/css/**"
      - "tests/test_shield_billing_lock.py"
      - ".github/workflows/shield-billing-lock.yml"
  push:
    branches: ["main"]
    paths:
      - "shield.html"
      - "assets/js/**"
      - "assets/css/**"
      - "tests/test_shield_billing_lock.py"
      - ".github/workflows/shield-billing-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shield-billing-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Shield commercial boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run fail-closed Shield billing guard
        run: python -m pytest -q tests/test_shield_billing_lock.py
