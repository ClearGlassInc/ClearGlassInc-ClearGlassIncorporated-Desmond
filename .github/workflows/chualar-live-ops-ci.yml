name: Chualar Live Operations CI

on:
  pull_request:
    branches: [main]
    paths:
      - "app/api/live/ops/**"
      - "app/chualar/**"
      - "lib/live-ops/**"
      - "tests/live-ops.test.ts"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/chualar-live-ops-ci.yml"
  push:
    branches: ["main", "feat/chualar-live-operations-2026-10-13"]
    paths:
      - "app/api/live/ops/**"
      - "app/chualar/**"
      - "lib/live-ops/**"
      - "tests/live-ops.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/chualar-live-ops-ci.yml"

permissions:
  contents: read

concurrency:
  group: chualar-live-ops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
