name: Maintenance Review

# The governed self-improvement loop: scheduled, never continuous.
#
# It collects non-sensitive operational evidence, asks
# scripts/automation_governance.py whether the repository is in a state where
# automated change is safe at all, and publishes a prioritised backlog. It
# proposes; it does not merge. Nothing here pushes to a branch, edits a
# workflow, or touches a payment path — those are protected paths that the
# policy module refuses on principle, and this workflow has no write
# permissions with which to try.
#
# The breakers are evaluated BEFORE the backlog is written, and every health
# signal defaults to failing when it cannot be established. A run that cannot
# prove the repository is healthy reports "halted" rather than proposing work.

on:
  schedule:
    # Weekly, Monday 12:00 UTC. Deliberately not daily: a backlog nobody has
    # read yet is not improved by regenerating it.
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-review
  cancel-in-progress: false

jobs:
  review:
    name: Collect evidence and evaluate circuit breakers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Needed to file the backlog as an issue. Deliberately the only write
      # grant in this workflow: it can describe work, never perform it.
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify the automation policy still refuses what it claims to
        # A policy module edited into uselessness is worse than no policy, so
        # its invariants are checked before any decision is made from it.
        run: python3 scripts/automation_governance.py --self-check

      - name: Collect operational evidence
        id: evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/review"

          # Each signal is proven here or left false. "Not reported" and
          # "failing" are the same answer to a system deciding whether to
          # change itself unattended.
          secret_scan=false
          payment_tests=false
          vuln_scan=false

          if python3 scripts/secret_scan.py >"${RUNNER_TEMP}/review/secret-scan.txt" 2>&1; then
            secret_scan=true
          fi

          pip install --quiet -r control-plane/requirements.txt pytest
          if (cd control-plane && python -m pytest tests/ -q \
                >"${RUNNER_TEMP}/review/payment-tests.txt" 2>&1); then
            payment_tests=true
          fi

          if pip install --quiet pip-audit && \
             pip-audit --strict -r control-plane/requirements.txt \
                >"${RUNNER_TEMP}/review/pip-audit.txt" 2>&1; then
            vuln_scan=true
          fi

          # Open bot pull requests, so the loop can see its own backlog depth.
          open_bot_prs=$(gh pr list --repo "$GH_REPO" --state open \
            --label automated-pr --json number --jq 'length' 2>/dev/null || echo 3)

          cat >"${RUNNER_TEMP}/review/state.json" <<EOF
          {
            "secret_scan_passing": ${secret_scan},
            "critical_vulnerability_scan_passing": ${vuln_scan},
            "payment_tests_passing": ${payment_tests},
            "production_health_passing": ${{ vars.PRODUCTION_HEALTH_PASSING || 'false' }},
            "webhook_verification_passing": ${payment_tests},
            "order_reconciliation_passing": ${payment_tests},
            "inventory_reconciliation_passing": ${payment_tests},
            "fulfillment_checks_passing": ${payment_tests},
            "consecutive_deploy_failures": ${{ vars.CONSECUTIVE_DEPLOY_FAILURES || 0 }},
            "open_bot_prs": ${open_bot_prs},
            "auto_merges_today": 0
          }
          EOF
          cat "${RUNNER_TEMP}/review/state.json"

      - name: Evaluate circuit breakers
        id: breakers
        continue-on-error: true  # a halt is a finding to report, not a failed run
        run: |
          set -uo pipefail
          python3 scripts/automation_governance.py \
            --state "${RUNNER_TEMP}/review/state.json" \
            | tee "${RUNNER_TEMP}/review/breakers.txt"
          echo "halted=$?" >> "$GITHUB_OUTPUT"

      - name: Build the improvement backlog
        run: |
          set -euo pipefail
          {
            echo "# Maintenance review — $(date -u +%Y-%m-%d)"
            echo
            echo "Policy version: $(python3 -c 'import sys; sys.path.insert(0, "scripts"); import automation_governance as g; print(g.POLICY_VERSION)')"
            echo
            echo "## Circuit breakers"
            echo '```'
            cat "${RUNNER_TEMP}/review/breakers.txt"
            echo '```'
            echo
            echo "## Evidence"
            for report in secret-scan payment-tests pip-audit; do
              file="${RUNNER_TEMP}/review/${report}.txt"
              [ -f "$file" ] || continue
              echo "### ${report}"
              echo '```'
              tail -n 25 "$file"
              echo '```'
            done
            echo
            echo "## What this run may act on"
            echo
            echo "Nothing automatically. This workflow has no write access to"
            echo "repository content. Every finding below needs a human to open"
            echo "and review a pull request, and anything touching a protected"
            echo "path (payments, workflows, auth, migrations, dependencies,"
            echo "infrastructure, published legal text) requires approval"
            echo "regardless of how small the change looks."
          } > "${RUNNER_TEMP}/review/backlog.md"
          cat "${RUNNER_TEMP}/review/backlog.md"

      - name: File the backlog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh issue create --repo "$GH_REPO" \
            --title "Maintenance review — $(date -u +%Y-%m-%d)" \
            --body-file "${RUNNER_TEMP}/review/backlog.md" \
            --label automated-report || {
              echo "::warning::could not file the backlog issue; the report is in this run's log"
            }
