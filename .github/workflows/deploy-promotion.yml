name: Deploy Promotion (Staging -> Production)

# One commit, proven twice: re-run the gates on it, deploy it to staging, smoke-test
# it and run the end-to-end contract checks against it, then deploy the same SHA to
# production behind the production environment's required reviewers (AUTOMATION.md).
# The provider is the repository variable DEPLOY_PROVIDER (render by default;
# cloudrun builds one image in staging and promotes that exact digest).
#
# OFF BY DEFAULT on push. commerce-deploy.yml already deploys production on every
# push to main that touches the commerce tree; running both would send two
# deploys per push. To switch: set the repository variable
# PROMOTION_PIPELINE_ENABLED=true AND delete the RENDER_DEPLOY_HOOK_URL repository
# secret (commerce-deploy.yml then keeps its gates and skips its own deploy).
# A manual workflow_dispatch always runs: it is an explicit human request.
#
# Rollback. render: none automatic (docs/INCIDENT_RESPONSE.md); a failed production
# deploy opens an incident issue naming the last known-good SHA for the Rollback
# workflow. cloudrun: traffic is routed back to the previous revision in one shot,
# unless the release ships control-plane migrations since the last good production
# deploy (RUN_MIGRATIONS applies them at boot; moving traffic back does not
# un-migrate a schema), in which case a human decides. The issue opens either way.

on:
  push:
    branches: ["main"]
    paths:
      - "control-plane/**"
      - "render.yaml"
      - ".github/workflows/deploy-promotion.yml"
      - ".github/workflows/reusable-deploy.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Full commit SHA on main to promote (default: the commit this run is on)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Never two promotions at once: the survivor would be whichever finished last.
  group: deploy-promotion
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the release
    if: github.event_name == 'workflow_dispatch' || vars.PROMOTION_PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      previous_good: ${{ steps.previous.outputs.sha }}
      auto_rollback: ${{ steps.rollback.outputs.auto_rollback }}
      services: ${{ steps.rollback.outputs.services }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the commit
        id: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-$GITHUB_SHA}"
          if ! printf '%s' "$ref" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::ref must be a full 40-character commit SHA, got '${ref}'"
            exit 1
          fi
          # Only reviewed history ships: refuse a commit that never reached the default branch.
          if ! git merge-base --is-ancestor "$ref" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::${ref} is not on ${DEFAULT_BRANCH}; it was never reviewed into it."
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          git --no-pager log -1 --format='Promoting %h %s (%an)' "$ref"

      - name: Find the last known-good production deploy
        id: previous
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CG_REF: ${{ steps.ref.outputs.ref }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner, repo, environment: 'production', per_page: 30,
            });
            for (const deployment of deployments) {
              if (deployment.sha === process.env.CG_REF) continue;
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner, repo, deployment_id: deployment.id, per_page: 10,
              });
              if (statuses[0]?.state === 'success') {
                core.setOutput('sha', deployment.sha);
                core.info(`Last known-good production revision: ${deployment.sha}`);
                return;
              }
            }
            core.warning('No successful production deployment found; a failure will not name a rollback target.');
            core.setOutput('sha', '');

      - name: Decide whether production may roll back automatically
        id: rollback
        env:
          PROVIDER: ${{ vars.DEPLOY_PROVIDER || 'render' }}
          REF: ${{ steps.ref.outputs.ref }}
          PREVIOUS: ${{ steps.previous.outputs.sha }}
          RELEASE_SERVICES: ${{ vars.RELEASE_SERVICES || 'control-plane' }}
        run: |
          set -euo pipefail
          auto=false
          reason="provider $PROVIDER rolls back by hand (Rollback workflow)"
          if [ "$PROVIDER" = "cloudrun" ]; then
            if [ -z "$PREVIOUS" ] || ! git cat-file -e "${PREVIOUS}^{commit}" 2>/dev/null; then
              reason="no known-good production commit to compare migrations against"
            elif git diff --quiet "$PREVIOUS" "$REF" -- control-plane/migrations; then
              auto=true
              reason="no control-plane migrations since ${PREVIOUS:0:7}"
            else
              reason="control-plane migrations changed since ${PREVIOUS:0:7}; a human decides"
            fi
          fi
          echo "auto_rollback=$auto" >> "$GITHUB_OUTPUT"
          echo "services=$RELEASE_SERVICES" >> "$GITHUB_OUTPUT"
          echo "### Automatic production rollback: **$auto** ($reason)" >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: Gates on the release commit
    needs: resolve
    # A called workflow's jobs may only request what the caller grants, even jobs
    # that will be skipped; reusable-ci's optional CodeQL job asks for these two.
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/reusable-ci.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}

  staging:
    name: Staging
    needs: [resolve, gate]
    permissions:
      contents: read
      id-token: write # cloudrun's OIDC exchange
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: staging
      ref: ${{ needs.resolve.outputs.ref }}
      run_smoke: true
      run_e2e: false
      services: ${{ needs.resolve.outputs.services }}
      build: true # cloudrun: the one build of this release; production reuses its digest
      auto_rollback: true # staging holds no customer data
    secrets: inherit

  e2e:
    name: Staging end-to-end
    needs: [resolve, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Contract checks against staging (read-only)
        env:
          URLS: ${{ needs.staging.outputs.urls }}
          DEPLOY_URL: ${{ needs.staging.outputs.deploy_url }}
        run: |
          set -euo pipefail
          urls="${URLS:-}"
          if [ -z "$urls" ]; then urls='{}'; fi
          api="$(jq -r '."control-plane" // empty' <<<"$urls")"
          storefront="$(jq -r '.storefront // empty' <<<"$urls")"
          api="${api:-$DEPLOY_URL}"
          if [ -z "$api" ]; then
            echo "::error::staging reported no control-plane URL; refusing to promote untested"
            exit 1
          fi
          python3 scripts/ci/e2e_staging.py --api "$api" --storefront "$storefront"

  production:
    name: Production
    needs: [resolve, staging, e2e]
    permissions:
      contents: read
      id-token: write # cloudrun's OIDC exchange
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: production
      ref: ${{ needs.resolve.outputs.ref }}
      run_smoke: true
      run_e2e: true
      rollback_hint_ref: ${{ needs.resolve.outputs.previous_good }}
      services: ${{ needs.resolve.outputs.services }}
      build: false # never rebuild for production
      auto_rollback: ${{ needs.resolve.outputs.auto_rollback == 'true' }}
    secrets: inherit

  incident:
    name: Open an incident record
    needs: [resolve, production]
    if: always() && needs.production.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open the incident issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CG_REF: ${{ needs.resolve.outputs.ref }}
          CG_PREVIOUS: ${{ needs.resolve.outputs.previous_good }}
          CG_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CG_OUTCOME: ${{ needs.production.outputs.outcome }}
        with:
          script: |
            const ref = process.env.CG_REF;
            const previous = process.env.CG_PREVIOUS;
            const lines = [
              `Production deploy of \`${ref}\` failed its post-deploy checks.`,
              '',
              `- Run: ${process.env.CG_RUN_URL}`,
              process.env.CG_OUTCOME === 'rolled-back'
                ? '- Traffic was already routed back to the previous revision automatically. Verify it is healthy; fix forward through a pull request.'
                : '- Traffic was NOT moved back automatically.',
              previous
                ? `- Last known-good revision: \`${previous}\``
                : '- No known-good revision was recorded; choose one from the production deployment history.',
              '',
              '### Required follow-up (docs/INCIDENT_RESPONSE.md)',
              '',
              previous
                ? `- [ ] Actions -> Rollback -> Run workflow with \`target_sha=${previous}\`, \`surface=control-plane\``
                : '- [ ] Actions -> Rollback -> Run workflow with a known-good `target_sha`',
              '- [ ] Do not roll forward; capture evidence first',
              '- [ ] Open a remediation pull request against the change that caused this',
            ];
            const { data } = await github.rest.issues.create({
              ...context.repo,
              title: `Production deploy failed: ${ref.slice(0, 7)}`,
              body: lines.join('\n'),
              labels: ['incident', 'deploy-promotion'],
            });
            core.info(`Opened incident #${data.number}`);
