# Reusable Percival v9 policy gate (workflow_call pattern from
# docs/CROSS_REPO_GITHUB_ACTIONS.md). Callable from this repo today and from
# sibling repos later via `uses: ClearGlassInc/ClearGlassInc.github.io/...@<sha>`.
name: Percival Policy Tests (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to test against
        required: false
        type: string
        default: "3.11"

permissions:
  contents: read

jobs:
  policy-tests:
    name: Fail-closed policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - run: pip install pytest
      - name: Run Percival v9 fail-closed boundary tests
        run: pytest tests/test_percival_v9_policy.py -q
      - name: Log cross-workflow handoff
        run: echo "Percival policy gate completed for ${{ github.repository }}@${{ github.sha }}"
