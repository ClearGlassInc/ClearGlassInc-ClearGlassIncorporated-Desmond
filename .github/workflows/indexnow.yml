name: IndexNow Submission

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated canonical ClearGlass URLs"
        required: true
        default: "https://www.clearglassinc.com/"

permissions:
  contents: read

concurrency:
  group: indexnow-submission
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: search-submission
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate and submit URLs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SUBMISSION_URLS: ${{ inputs.urls }}
        run: |
          set -euo pipefail
          read -r -a urls <<< "$SUBMISSION_URLS"
          python3 tools/indexnow_submit.py "${urls[@]}"
