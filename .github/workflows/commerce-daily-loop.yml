name: Commerce Daily Loop

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC daily — executive report + governance self-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-loop:
    name: Daily executive report + governance self-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Storefront checkout smoke test (SOUL.md daily smoke guardrail)
        run: python bots/store_smoke_bot.py
      - name: Governance self-check (fails if any financial action is auto-executable)
        working-directory: control-plane
        run: python -m app.daily_loop --json
      - name: Executive report
        working-directory: control-plane
        run: |
          python -m app.daily_loop | tee "$GITHUB_STEP_SUMMARY"
      - name: RFED governance self-check (fails if a privileged agent action is auto-executable)
        run: |
          python -m bots.rfed_audit_bot --self-check | tee -a "$GITHUB_STEP_SUMMARY"
