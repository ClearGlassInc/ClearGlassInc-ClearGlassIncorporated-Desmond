name: ClearGlass Revenue Pipeline Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1-5"

permissions:
  contents: read

jobs:
  pipeline-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # Pinned to a full commit SHA like every other action in this
        # repository: a moving tag is remote code that can change under a
        # scheduled job nobody is watching. Enforced by
        # scripts/audit_github_actions.py, which ci.yml runs.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate commercial evidence
        run: python agents/revenue_pipeline_agent/agent.py --validate

      - name: Report pipeline state
        run: python agents/revenue_pipeline_agent/agent.py --report
