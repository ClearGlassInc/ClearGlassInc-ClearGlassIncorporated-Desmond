name: Site Reliability Audit

on:
  pull_request:
    paths:
      - "**/*.html"
      - "sitemap*.xml"
      - "robots.txt"
      - "scripts/site_reliability_audit.py"
      - "scripts/live_sitemap_crawl.py"
      - "scripts/audit_github_actions.py"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "sitemap*.xml"
      - "robots.txt"
      - "scripts/site_reliability_audit.py"
      - "scripts/live_sitemap_crawl.py"
      - "scripts/audit_github_actions.py"
      - ".github/workflows/**"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Confirm original homepage still present
        run: |
          set -euo pipefail
          test -f index.html
          grep -q "ClearGlass Inc — AI Automation, Cybersecurity" index.html
          grep -q "@keyframes" index.html
          echo "Original homepage and animations remain in source."
      - name: Run optional reliability scripts if present
        run: |
          set -euo pipefail
          if [ -f scripts/site_reliability_audit.py ]; then
            python scripts/site_reliability_audit.py | tee site-reliability.txt
          else
            echo "scripts/site_reliability_audit.py not present; source homepage check passed." | tee site-reliability.txt
          fi
      - name: Upload offline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-reliability-offline-${{ github.run_id }}
          path: site-reliability.txt
          if-no-files-found: error
          retention-days: 30
