name: ARTEMIS FAWL validation
on:
  pull_request:
    paths:
      - "artemis-fawl/**"
      - "agents/artemis_fawl_revenue.py"
      - "agents/__init__.py"
      - "tests/test_artemis_fawl_revenue.py"
      - ".github/workflows/artemis-fawl.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check "pytest>=8.2,<9"
      - name: Validate static surface and source policy
        run: |
          test -s artemis-fawl/index.html
          test -s artemis-fawl/styles.css
          test -s artemis-fawl/app.js
          python -m json.tool artemis-fawl/data/source-registry.json >/dev/null
          ! grep -RIE '(api[_-]?key|secret|access[_-]?token|private[_-]?key)[[:space:]]*[:=]' artemis-fawl agents/artemis_fawl_revenue.py
      - name: Run focused policy tests
        run: python -m pytest -q tests/test_artemis_fawl_revenue.py
