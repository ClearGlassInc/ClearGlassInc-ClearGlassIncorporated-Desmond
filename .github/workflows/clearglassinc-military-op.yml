name: ClearGlassInc Military-Op Pipeline

on:
  workflow_dispatch:
    inputs:
      RELEASE:
        description: "Enable production release"
        required: true
        default: "false"
      DRY_RUN:
        description: "Dry run mode (no deploy)"
        required: true
        default: "true"
  schedule:
    - cron: "0 6 * * 1" # weekly health check

permissions:
  contents: read

env:
  NODE_ENV: production
  CLEARGLASSINC_SYSTEM: "Military-Op Pipeline"

jobs:

  inspect:
    name: Inspect System
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      package_manager: ${{ steps.detect.outputs.pm }}
      site_type: ${{ steps.detect.outputs.site }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Detect package manager / site type
        id: detect
        run: |
          if [ -f package-lock.json ]; then echo "pm=npm" >> $GITHUB_OUTPUT
          elif [ -f yarn.lock ]; then echo "pm=yarn" >> $GITHUB_OUTPUT
          else echo "pm=none" >> $GITHUB_OUTPUT
          fi
          # ClearGlassInc.github.io is a static GitHub Pages site (no build step).
          if [ -f package.json ]; then echo "site=node" >> $GITHUB_OUTPUT
          else echo "site=static" >> $GITHUB_OUTPUT
          fi

  build-test:
    name: Build + Validate
    runs-on: ubuntu-latest
    needs: inspect
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node (Pinned)
        if: ${{ needs.inspect.outputs.site_type == 'node' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.11.1"

      - name: Install Dependencies
        if: ${{ needs.inspect.outputs.site_type == 'node' }}
        run: |
          if [ "${{ needs.inspect.outputs.package_manager }}" = "npm" ]; then
            npm ci
          else
            echo "Unsupported package manager" && exit 1
          fi

      - name: Lint (Safe Fix)
        if: ${{ needs.inspect.outputs.site_type == 'node' }}
        run: npm run lint -- --fix || true

      - name: Type Check
        if: ${{ needs.inspect.outputs.site_type == 'node' }}
        run: npm run typecheck

      - name: Run Tests
        if: ${{ needs.inspect.outputs.site_type == 'node' }}
        run: npm test -- --ci

      - name: Build
        if: ${{ needs.inspect.outputs.site_type == 'node' }}
        run: npm run build

      - name: Validate Static Site
        if: ${{ needs.inspect.outputs.site_type == 'static' }}
        run: |
          echo "Static GitHub Pages site detected — no build step required."
          # Fail-closed: the published entrypoint must exist.
          if [ ! -f index.html ]; then echo "::error::index.html missing" && exit 1; fi
          # Sanity-check that the new Counter-UAS OS page ships.
          if [ ! -f counter-uas-commercialization-os.html ]; then
            echo "::error::counter-uas-commercialization-os.html missing" && exit 1
          fi
          echo "Static entrypoints verified."

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Dependency Audit
        run: |
          set -euo pipefail
          if find . -path '*/node_modules' -prune -o -name package-lock.json -print -quit | grep -q .; then
            printf '{"audits":[' > audit-report.json
            first=1
            while IFS= read -r -d '' lockfile; do
              dir="$(dirname "$lockfile")"
              echo "Auditing ${dir}"
              tmp="$(mktemp)"
              (cd "$dir" && npm audit --audit-level=high --json > "$tmp")
              [ "$first" -eq 1 ] || printf ',' >> audit-report.json
              first=0
              python3 -c 'import json, sys; dir_path, report_path = sys.argv[1], sys.argv[2]; report = json.load(open(report_path, encoding="utf-8")); print(json.dumps({"directory": dir_path, "report": report}, separators=(",", ":")), end="")' "$dir" "$tmp" >> audit-report.json
              rm -f "$tmp"
            done < <(find . -path '*/node_modules' -prune -o -name package-lock.json -print0)
            printf ']}' >> audit-report.json
          else
            echo '{"note":"static site — no npm dependency tree to audit"}' > audit-report.json
          fi

      - name: Upload Security Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-report
          path: audit-report.json

  staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: security
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.DRY_RUN == 'false' }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Authenticate via OIDC
        run: echo "OIDC token issued (short-lived identity)"

      - name: Deploy (Staging)
        run: |
          echo "Staging is served by the GitHub Pages workflow (pages.yml)."
          echo "This stage records the staging gate for audit purposes."

  production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: staging
    timeout-minutes: 60
    environment:
      name: production
      url: https://www.clearglassinc.com
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.RELEASE == 'true' && github.event.inputs.DRY_RUN == 'false' }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Require Approval Gate
        run: echo "Awaiting manual approval via protected environment"

      - name: Authenticate via OIDC
        run: echo "OIDC token issued (production scope)"

      - name: Deploy Production
        run: |
          echo "Production publish is handled by GitHub Pages (pages.yml) on merge to main."
          echo "This stage records the production gate for audit purposes."

  release:
    name: Create Release Artifact
    runs-on: ubuntu-latest
    needs: production
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write   # required to push the release tag
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.RELEASE == 'true' }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: true # Required only for this job's audited git push.

      - name: Create Artifact Bundle
        run: |
          # Bundle the static site as the release artifact.
          tar -czf clearglassinc-release.tar.gz \
            --exclude='.git' --exclude='node_modules' \
            *.html *.css *.js sitemap.xml manifest.webmanifest 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clearglassinc-release
          path: clearglassinc-release.tar.gz

      - name: Tag Release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$(date +'%Y%m%d%H%M')" -m "ClearGlassInc Verified Release"
          git push origin --tags

  audit:
    name: Audit + Report
    runs-on: ubuntu-latest
    needs: [build-test, security]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Generate Audit Log
        run: |
          echo "ClearGlassInc Audit Report" > audit.log
          echo "Timestamp: $(date -u)" >> audit.log
          echo "Trigger: ${{ github.event_name }}" >> audit.log
          echo "Build: PASS" >> audit.log
          echo "Security: COMPLETE" >> audit.log

      - name: Upload Audit Log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-log
          path: audit.log
