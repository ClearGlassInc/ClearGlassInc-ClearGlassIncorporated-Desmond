name: CI Telemetry (Weekly)

# Weekly health of every workflow in the repository (AUTOMATION.md): runs, failure
# rate, fast failures, flaky runs (passed only on a re-run, or both red and green
# on the same commit), the slowest workflows and the slowest CI jobs over the last
# 7 days, written to ONE open issue labelled ci-telemetry that is edited in place
# each week. With the CI_ALERTS_WEBHOOK_URL secret set (a Slack-compatible
# incoming webhook for #ci-alerts), the headline is posted there too.
#
# "Fast failure" means a failed run that finished in under 20 seconds. That is the
# shape of the runner-dispatch problem in CLAUDE.md (runner_id 0, no steps), so a
# high count points at settings rather than code. It is a duration heuristic:
# confirm on one job before acting on it.
#
# Read-only on Actions; its writes are that one issue and the optional webhook.

on:
  schedule:
    - cron: "47 8 * * 1" # Mondays 08:47 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-telemetry
  cancel-in-progress: false

jobs:
  telemetry:
    name: Aggregate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
    steps:
      - name: Aggregate the last 7 days and upsert the issue
        id: telemetry
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const since = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
            const runs = [];
            for await (const { data } of github.paginate.iterator(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, created: `>=${since}`, per_page: 100 },
            )) {
              runs.push(...data);
              if (runs.length >= 2000) break;
            }

            const seconds = r => (new Date(r.updated_at) - new Date(r.run_started_at || r.created_at)) / 1000;
            const median = xs => {
              if (!xs.length) return 0;
              const s = [...xs].sort((a, b) => a - b);
              const m = Math.floor(s.length / 2);
              return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
            };
            const fmt = s => (s >= 60 ? `${(s / 60).toFixed(1)} min` : `${Math.round(s)} s`);

            const by = new Map();
            for (const r of runs) {
              if (r.status !== 'completed') continue;
              const w = by.get(r.name) || { name: r.name, total: 0, success: 0, failure: 0, fast: 0, other: 0, durations: [] };
              w.total++;
              if (r.conclusion === 'success') w.success++;
              else if (r.conclusion === 'failure') { w.failure++; if (seconds(r) < 20) w.fast++; }
              else w.other++;
              w.durations.push(seconds(r));
              by.set(r.name, w);
            }
            // Flaky: green only after a re-run, or both red and green on one commit.
            const outcomes = new Map();
            for (const r of runs) {
              if (r.status !== 'completed') continue;
              const w = by.get(r.name);
              if (w && r.conclusion === 'success' && (r.run_attempt || 1) > 1) w.retried = (w.retried || 0) + 1;
              const key = `${r.name}@${r.head_sha}`;
              const seen = outcomes.get(key) || new Set();
              seen.add(r.conclusion);
              outcomes.set(key, seen);
            }
            for (const [key, seen] of outcomes) {
              if (seen.has('success') && seen.has('failure')) {
                const w = by.get(key.slice(0, key.lastIndexOf('@')));
                if (w) w.mixed = (w.mixed || 0) + 1;
              }
            }
            const flaky = [...by.values()].filter(w => (w.retried || 0) + (w.mixed || 0) > 0);

            // Slowest CI jobs: per-job medians over the latest completed CI runs.
            const jobDurations = new Map();
            const ciRuns = runs.filter(r => r.name === 'CI' && r.status === 'completed').slice(0, 20);
            for (const r of ciRuns) {
              const { data } = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: r.id, per_page: 100 });
              for (const job of data.jobs) {
                if (!job.started_at || !job.completed_at || !(job.steps || []).length) continue;
                const list = jobDurations.get(job.name) || [];
                list.push((new Date(job.completed_at) - new Date(job.started_at)) / 1000);
                jobDurations.set(job.name, list);
              }
            }
            const slowJobs = [...jobDurations.entries()]
              .map(([name, xs]) => ({ name, n: xs.length, median: median(xs) }))
              .sort((a, b) => b.median - a.median)
              .slice(0, 10);

            const all = [...by.values()];
            const sum = k => all.reduce((n, w) => n + w[k], 0);
            const total = sum('total');
            const pct = (a, b) => (b ? `${((a / b) * 100).toFixed(1)}%` : 'n/a');

            const lines = [
              `## CI telemetry: ${since} to ${new Date().toISOString().slice(0, 10)}`,
              '',
              `- Completed runs: ${total}${runs.length >= 2000 ? ' (capped at 2000)' : ''}`,
              `- Success: ${sum('success')}  |  Failure: ${sum('failure')}  |  Other (cancelled, skipped, neutral): ${sum('other')}`,
              `- Failure rate: ${pct(sum('failure'), total)}`,
              `- Fast failures (<20 s, runner-dispatch shape): ${sum('fast')} of ${sum('failure')}`,
              '',
              '### Most failing workflows',
              '',
              '| Workflow | Runs | Failed | Failure rate | Fast failures | Median duration |',
              '|---|---:|---:|---:|---:|---:|',
              ...all
                .filter(w => w.failure > 0)
                .sort((a, b) => b.failure - a.failure)
                .slice(0, 15)
                .map(w => `| ${w.name} | ${w.total} | ${w.failure} | ${pct(w.failure, w.total)} | ${w.fast} | ${fmt(median(w.durations))} |`),
              '',
              '### Flaky workflows',
              '',
              ...(flaky.length
                ? [
                    '| Workflow | Passed only on re-run | Red and green on one commit |',
                    '|---|---:|---:|',
                    ...flaky.map(w => `| ${w.name} | ${w.retried || 0} | ${w.mixed || 0} |`),
                  ]
                : ['None this week.']),
              '',
              '### Slowest workflows (median)',
              '',
              '| Workflow | Runs | Median duration |',
              '|---|---:|---:|',
              ...all
                .sort((a, b) => median(b.durations) - median(a.durations))
                .slice(0, 5)
                .map(w => `| ${w.name} | ${w.total} | ${fmt(median(w.durations))} |`),
              '',
              `### Slowest CI jobs (median over the last ${ciRuns.length} CI runs)`,
              '',
              ...(slowJobs.length
                ? ['| Job | Runs | Median |', '|---|---:|---:|', ...slowJobs.map(j => `| ${j.name} | ${j.n} | ${fmt(j.median)} |`)]
                : ['No CI job ran any steps (runner-dispatch problem: see below).']),
              '',
              'If most failures are fast failures, read PRODUCTION-RECOVERY.md §1.4 before touching any workflow.',
              `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            ];
            const body = lines.join('\n');
            const title = 'Weekly CI Telemetry';
            core.setOutput(
              'headline',
              `CI telemetry ${since}: ${total} runs, failure rate ${pct(sum('failure'), total)}, ` +
              `${sum('fast')} fast failures, ${flaky.length} flaky workflow(s). ` +
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            );

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'ci-telemetry', per_page: 100,
            });
            const existing = open.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              core.info(`Updated #${existing.number}`);
            } else {
              const { data } = await github.rest.issues.create({ owner, repo, title, body, labels: ['ci-telemetry'] });
              core.info(`Opened #${data.number}`);
            }

      - name: Post the headline to #ci-alerts
        if: steps.telemetry.outputs.headline != ''
        env:
          ALERTS_URL: ${{ secrets.CI_ALERTS_WEBHOOK_URL }}
          HEADLINE: ${{ steps.telemetry.outputs.headline }}
        run: |
          set -euo pipefail
          if [ -z "${ALERTS_URL:-}" ]; then
            echo "No #ci-alerts URL secret is set; the issue is the only report."
            exit 0
          fi
          jq -n --arg text "$HEADLINE" '{text: $text}' \
            | curl --fail --silent --show-error --max-time 20 -H 'Content-Type: application/json' -d @- "$ALERTS_URL" > /dev/null
