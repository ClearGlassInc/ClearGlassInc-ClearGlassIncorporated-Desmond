name: Minerals Link Authority Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/minerals-link-authority-sync.yml
  push:
    branches:
      - fix/minerals-production-hardening-20260809
    paths:
      - .github/workflows/minerals-link-authority-sync.yml

permissions:
  contents: write

concurrency:
  group: minerals-link-authority-sync
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: fix/minerals-production-hardening-20260809

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Classify indexable pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('tools/internal_links.py')
          text = path.read_text(encoding='utf-8')
          marker = 'CLUSTERS: dict[str, dict] = {'
          pages, sep, clusters = text.partition(marker)
          if not sep:
              raise SystemExit('CLUSTERS marker not found')

          def add_page(source, anchor_key, new_key, new_line):
              if f'"{new_key}":' in source:
                  return source
              pattern = rf'(^\s*"{re.escape(anchor_key)}":.*$)'
              updated, count = re.subn(pattern, rf'\1\n{new_line}', source, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'PAGES anchor not found: {anchor_key}')
              return updated

          def add_member(source, anchor_path, new_path):
              if re.search(rf'^\s*"{re.escape(new_path)}",?\s*$', source, flags=re.MULTILINE):
                  return source
              pattern = rf'(^\s*"{re.escape(anchor_path)}",?\s*$)'
              match = re.search(pattern, source, flags=re.MULTILINE)
              if not match:
                  raise SystemExit(f'cluster anchor not found: {anchor_path}')
              indent = re.match(r'^\s*', match.group(0)).group(0)
              updated = source[:match.end()] + f'\n{indent}"{new_path}",' + source[match.end():]
              return updated

          pages = add_page(
              pages,
              'intelligence-platform.html',
              'minerals.html',
              '    "minerals.html": ("Critical Minerals Intelligence", "source-transparent critical-minerals intelligence, provenance and risk analytics"),',
          )
          pages = add_page(
              pages,
              'clearsight.html',
              'mission-control.html',
              '    "mission-control.html": ("Mission Control", "operational mission gallery for ClearGlass deployments and engineering work"),',
          )
          pages = add_page(
              pages,
              'blog/ontario-influence-environment-august-2026.html',
              'blog/ontario-influence-infrastructure-monitoring.html',
              '    "blog/ontario-influence-infrastructure-monitoring.html": ("Ontario Influence Infrastructure Monitoring", "verification-first monitoring of Ontario influence infrastructure"),',
          )

          clusters = add_member(clusters, 'docs/guardian_command_nexus_spec.html', 'minerals.html')
          clusters = add_member(clusters, 'command-center.html', 'mission-control.html')
          clusters = add_member(clusters, 'blog/shadow-ai-incident-response-logs-gone.html', 'blog/ontario-influence-infrastructure-monitoring.html')

          path.write_text(pages + sep + clusters, encoding='utf-8')
          PY

      - name: Regenerate internal authority graph
        run: python3 tools/internal_links.py

      - name: Regenerate search assets
        run: python3 tools/generate_search_assets.py

      - name: Validate generated state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/internal_links.py --check
          python3 tools/generate_search_assets.py --check
          git diff --check

      - name: Commit generated authority graph
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No authority-graph changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(minerals): classify production authority graph [skip ci]"
          git push origin HEAD:fix/minerals-production-hardening-20260809
