name: DELOS OS CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "delos-os/**"
      - ".github/workflows/delos-os-ci.yml"
  push:
    branches:
      - main
      - "feature/delos-os-mvp-2026-10-12"
      - "fix/delos-ci-main-trigger-2026-10-12"
    paths:
      - "delos-os/**"
      - ".github/workflows/delos-os-ci.yml"

permissions:
  contents: read

concurrency:
  group: delos-os-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install DELOS OS dependencies
        working-directory: delos-os
        run: npm install --no-audit --no-fund

      - name: Unit tests
        working-directory: delos-os
        run: npm test

      - name: Type check
        working-directory: delos-os
        run: npm run typecheck

      - name: Production build
        working-directory: delos-os
        run: npm run build
