name: Reusable CI

# The repository's real gates, callable from any workflow (AUTOMATION.md).
#
# ci.yml stays the authoritative PR/push gate and is not wired to this file; this
# exists so a deploy can re-prove the exact commit it is about to ship
# (deploy-promotion.yml calls it first). It runs what ci.yml runs for Python, the
# workflow-safety audit, and optionally the commerce frontends and CodeQL. It does
# not run eslint, prettier or black: this repo uses none of them, and running them
# repo-wide would fail on, or rewrite, thousands of untouched files.
#
# CodeQL is off by default. If GitHub's CodeQL "default setup" is enabled for the
# repository, an advanced-configuration upload is rejected, so turn it on only
# when default setup is off. The caller must grant security-events: write.

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to test. Defaults to the caller's commit."
        required: false
        type: string
        default: ""
      node_version:
        required: false
        type: string
        default: "22"
      python_version:
        required: false
        type: string
        default: "3.11"
      run_frontends:
        description: "Also typecheck and build storefront/ and admin/."
        required: false
        type: boolean
        default: false
      enable_codeql:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python:
    name: Lint + tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node + Python
        uses: ./.github/actions/setup-node-python
        with:
          node_version: ${{ inputs.node_version }}
          python_version: ${{ inputs.python_version }}

      - name: Lint (ruff, repo-wide)
        run: ruff check .

      - name: Root test suite
        run: pytest tests/ -q

  control-plane:
    name: Control plane (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node + Python
        uses: ./.github/actions/setup-node-python
        with:
          node_version: ${{ inputs.node_version }}
          python_version: ${{ inputs.python_version }}

      # requirements.txt pins httpx; without it the webhook -> DB -> /payouts tests
      # silently skip and the governed money paths go unexercised (CLAUDE.md).
      - name: Install control-plane requirements
        run: pip install -r control-plane/requirements.txt

      - name: Lint
        run: ruff check control-plane

      - name: Tests
        working-directory: control-plane
        run: python -m pytest tests/ -q

  workflow-safety:
    name: Workflow safety invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}

      - run: pip install pyyaml
      - run: python scripts/workflow_doctor.py
      - run: python scripts/audit_github_actions.py

  frontends:
    name: Frontend build (${{ matrix.app }})
    if: inputs.run_frontends
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [storefront, admin]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install, typecheck, build
        working-directory: ${{ matrix.app }}
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          npm run build

  codeql:
    name: CodeQL
    if: inputs.enable_codeql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python, javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
