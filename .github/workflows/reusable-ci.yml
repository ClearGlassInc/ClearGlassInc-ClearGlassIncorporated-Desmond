name: Reusable CI

# The repository's gates in callable form, used by deploy-promotion.yml so
# nothing is promoted that has not passed them.
#
# repo-gates runs scripts/ci_local.py, the offline mirror of every ci.yml job,
# so this file cannot drift from ci.yml: ci_local.py is the thing CLAUDE.md
# requires to be kept in step with it. Lighthouse is its one network gate and
# is not run here. commerce-gates and frontend-build mirror commerce-deploy.yml.
#
# ci.yml is deliberately NOT refactored into a caller of this file. Its job
# names are the check names branch protection reads; routing them through a
# reusable workflow renames every check to "<caller> / <job>" and silently
# orphans each required status.
#
# CodeQL is not here either. defensive-security-orchestrator.yml already
# uploads SARIF, and a called workflow that asks for security-events: write
# fails to load in any caller that does not grant it, even when the job
# would be skipped.
#
# Testing a ref older than the commit that added .github/actions/
# setup-node-python fails at setup, by design. Use rollback.yml to redeploy
# an older revision.

on:
  workflow_call:
    inputs:
      ref:
        description: Full commit SHA to test. Empty means the caller's commit.
        required: false
        type: string
        default: ""
      python_version:
        required: false
        type: string
        default: "3.11"
      node_version:
        required: false
        type: string
        default: "22"
      include_commerce:
        description: Also run the control-plane and storefront/admin gates from commerce-deploy.yml.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  repo-gates:
    name: Repository gates (ci.yml mirror)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Sitemap <lastmod> values come from git history; a shallow clone
          # dates every page wrong and the drift gate fails.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node + Python
        uses: ./.github/actions/setup-node-python
        with:
          node_version: ${{ inputs.node_version }}
          python_version: ${{ inputs.python_version }}

      - name: Run every offline ci.yml gate
        run: python3 scripts/ci_local.py

  commerce-gates:
    name: Commerce control-plane gate
    if: inputs.include_commerce
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node + Python
        uses: ./.github/actions/setup-node-python
        with:
          node_version: ${{ inputs.node_version }}
          python_version: ${{ inputs.python_version }}

      # The full web stack (httpx for TestClient) is what makes the webhook ->
      # DB -> /payouts integration tests run instead of silently skipping.
      - name: Install control-plane dependencies
        run: python -m pip install --quiet -r control-plane/requirements.txt

      - name: Lint commerce package
        run: ruff check control-plane

      - name: Governance and payments tests
        working-directory: control-plane
        run: python -m pytest tests/ -q

  frontend-build:
    name: Frontend build gate (${{ matrix.app }})
    if: inputs.include_commerce
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [storefront, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      # Node 20 to match commerce-deploy.yml, which builds these apps today.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Production build (next build)
        run: npm run build
