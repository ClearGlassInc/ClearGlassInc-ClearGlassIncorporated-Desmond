name: Cert Bot

on:
  schedule:
    # 06:17 UTC daily — surface expiring certs well ahead of the threshold
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      hosts:
        description: "Comma-separated hosts to check (overrides default)"
        required: false
        default: ""
      min_days:
        description: "Minimum acceptable days until expiry"
        required: false
        default: "21"

permissions:
  contents: read

concurrency:
  group: cert-bot
  cancel-in-progress: false

jobs:
  track:
    name: Cert Bot / track
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check TLS certificate expiry
        env:
          CERT_BOT_HOSTS: ${{ inputs.hosts || vars.CERT_BOT_HOSTS || 'www.clearglassinc.com' }}
          CERT_BOT_MIN_DAYS: ${{ inputs.min_days || '21' }}
          CERT_BOT_STRICT: "1"
        run: python scripts/cert_bot.py
