name: Cert Bot

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      hosts:
        description: "Comma-separated hosts to check (overrides default)"
        required: false
        default: ""
      min_days:
        description: "Minimum acceptable days until expiry"
        required: false
        default: "21"

permissions:
  contents: read

concurrency:
  group: cert-bot
  cancel-in-progress: false

jobs:
  track:
    name: Cert Bot / track
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Check TLS certificate expiry
        env:
          CERT_BOT_HOSTS: ${{ inputs.hosts || vars.CERT_BOT_HOSTS || 'www.clearglassinc.com' }}
          CERT_BOT_MIN_DAYS: ${{ inputs.min_days || '21' }}
          CERT_BOT_STRICT: "1"
        run: |
          if [ -f scripts/cert_bot.py ]; then
            python scripts/cert_bot.py
          else
            python - <<'PY'
          import os, socket, ssl, sys
          from datetime import datetime, timezone
          hosts = [h.strip() for h in os.environ.get('CERT_BOT_HOSTS', 'www.clearglassinc.com').split(',') if h.strip()]
          min_days = int(os.environ.get('CERT_BOT_MIN_DAYS', '21'))
          failed = 0
          for host in hosts:
              ctx = ssl.create_default_context()
              with socket.create_connection((host, 443), timeout=15) as sock:
                  with ctx.wrap_socket(sock, server_hostname=host) as ssock:
                      cert = ssock.getpeercert()
              not_after = datetime.strptime(cert['notAfter'], '%b %d %H:%M:%S %Y %Z').replace(tzinfo=timezone.utc)
              days = (not_after - datetime.now(timezone.utc)).days
              print(f"{host}: expires in {days} days ({not_after.date()})")
              if days < min_days:
                  print(f"::warning::{host} below {min_days}-day threshold")
                  failed += 1
          sys.exit(1 if failed else 0)
          PY
          fi
