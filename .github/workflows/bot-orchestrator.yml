name: Bot Orchestrator

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      target_bots:
        description: 'Comma-separated bot IDs to run (empty = all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — log actions without writing or committing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bot-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    name: Run Bot Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: automation-write
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: true # Required only for this job's audited git push.
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Run master orchestrator
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TARGET_BOTS: ${{ inputs.target_bots || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/bot_runner.py master_orchestrator

      - name: Commit generated outputs
        if: ${{ inputs.dry_run != true }}
        run: python scripts/content_committer.py

      - name: Push outputs to remote
        if: ${{ inputs.dry_run != true }}
        run: |
          # Concurrent bots push to main during our run; rebase and retry so a
          # non-fast-forward rejection doesn't silently drop generated outputs.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — rebasing onto latest main"
            git pull --rebase origin main || break
          done
          echo "::error::Could not push bot outputs after 5 attempts"
          exit 1

      - name: Upload bot outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bot-outputs-${{ github.run_id }}
          path: |
            marketing/output/
            operations/output/
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          SUMMARY="operations/output/orchestrator_summary.json"
          echo "## 🤖 Bot Orchestrator Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$SUMMARY" ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open("operations/output/orchestrator_summary.json"))
          print(f"**Run:** {data['run_utc']}")
          print(f"**Total:** {data['total']} | **OK:** {data['ok']} | **Failed:** {data['failed']} | **Skipped:** {data['skipped']}")
          print()
          print("| Bot | Status | Duration |")
          print("|-----|--------|----------|")
          for b in data["bots"]:
              icon = "✅" if b["status"] == "ok" else "❌" if b["status"] == "error" else "⊘"
              err = f" — {b['error']}" if b.get("error") else ""
              print(f"| `{b['bot_id']}` | {icon} {b['status']}{err} | {b['duration_s']}s |")
          PY
          else
            echo "Summary not available" >> "$GITHUB_STEP_SUMMARY"
          fi
