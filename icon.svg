<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ClearGlass Inc. browser tab stamp mark">
  <metadata>© 2026 ClearGlass Inc. Browser-tab-only neon stamp mark. This asset is separate from the ClearGlass company logo and does not modify the company logo files.</metadata>
  <defs>
