app = "clearglass-agent-service"
primary_region = "iad"

[build]
  dockerfile = "services/clearglass_agent_service/Dockerfile"

[env]
  PORT = "8080"
  CLEARGLASS_AGENT_VERSION = "0.1.0"
  CLEARGLASS_ALLOWED_ORGS = "ClearGlassInc"
  CLEARGLASS_ALLOWED_ORIGINS = "https://www.clearglassinc.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
