apiVersion: apps/v1
kind: Deployment
metadata:
  name: artemis-model
  namespace: artemis
  labels:
    app: artemis-model
spec:
  replicas: 3
  selector:
    matchLabels:
      app: artemis-model
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: artemis-model
    spec:
      serviceAccountName: artemis-model-sa
      containers:
        - name: api
          image: ghcr.io/clearglassinc/artemis-model:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: artemis-model-config
            - secretRef:
                name: artemis-model-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: artemis-model
  namespace: artemis
spec:
  selector:
    app: artemis-model
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: artemis-model
  namespace: artemis
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["artemis-model.prod.clearglassinc.internal"]
      secretName: artemis-model-tls
  rules:
    - host: artemis-model.prod.clearglassinc.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: artemis-model
                port:
                  number: 80
