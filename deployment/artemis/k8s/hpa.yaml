apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: artemis-model
  namespace: artemis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: artemis-model
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
